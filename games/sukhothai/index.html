<style>
.map{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.map i{font-style:normal;font-size:1.5rem;filter:grayscale(1);opacity:.45;transition:.3s}
.map i.on{filter:none;opacity:1;transform:scale(1.15)}
.ord{display:grid;gap:10px;margin-top:14px}
.ob{display:flex;align-items:center;gap:10px;text-align:left;border:3px solid var(--c);background:#fff;border-radius:16px;padding:12px 14px;font-weight:700;font-size:clamp(1rem,3vw,1.2rem);box-shadow:0 4px 0 var(--c);line-height:1.4}
.ob .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#EFE6DA;color:var(--ink-soft)}
.ob.done{background:#E8F8EE;border-color:#3FAE6A;box-shadow:0 4px 0 #3FAE6A}
.ob.done .n{background:#3FAE6A;color:#fff}
.ob.no{animation:shake .4s}
.ob .y{margin-left:auto;font-size:.85em;color:#3FAE6A;white-space:nowrap}
</style>
</head>

const B3 = [

  ["ในที่สุดสุโขทัยรวมเข้ากับอาณาจักรใด?","อยุธยา",["ล้านนา","ล้านช้าง","ขอม"],"ราว พ.ศ. 1981 สุโขทัยรวมเป็นส่วนหนึ่งของอยุธยา"],
  ["ไตรภูมิพระร่วงมีเนื้อหาเกี่ยวกับอะไร?","นรก สวรรค์ ตามความเชื่อพระพุทธศาสนา สอนให้ทำดี",["ตำราทำอาหาร","นิทานตลกขบขัน","กฎหมายการค้า"],"ไตรภูมิพระร่วงสอนเรื่องบาปบุญ ให้คนทำความดี"],

  ["พ่อขุนรามคำแหงชนช้างชนะขุนสามชน","สมัยพ่อขุนศรีอินทราทิตย์"],
  ["พ่อขุนรามคำแหงประดิษฐ์ลายสือไทย","พ.ศ. 1826"],

KIT.mount({
  key:"h4-sukhothai", title:"ผจญภัยแดนสุโขทัย", subtitle:"ประวัติศาสตร์ ป.4 · พัฒนาการและภูมิปัญญาสมัยสุโขทัย",
  heroHTML:"ย้อนเวลาไป<em>อาณาจักรสุโขทัย</em> 🐘", heroDesc:"ตอบคำถามเกี่ยวกับกษัตริย์ เหตุการณ์ และภูมิปัญญาสมัยสุโขทัย เก็บสัญลักษณ์ให้ครบ 10 ชิ้น",
  progIcon:"🐘",
  howto:["อ่านคำถามแล้วเลือกคำตอบ","ด่านยากจะมีข้อเรียงเหตุการณ์ แตะจากเหตุการณ์ที่เกิดก่อนไปหลัง","ตอบผิดจะมีคำอธิบาย แล้วลองใหม่ได้","ครบ 10 ข้อ เก็บสัญลักษณ์สุโขทัยครบ"],
  levels:{
    1:{pill:"10 ข้อ", color:"var(--green)", desc:"เรื่องพื้นฐาน 3 ตัวเลือก มีรูปช่วย"},
    2:{pill:"10 ข้อ", color:"var(--blue)", desc:"กษัตริย์ เหตุการณ์ และภูมิปัญญา 4 ตัวเลือก"},
    3:{pill:"10 ข้อ", color:"var(--purple)", desc:"เรียงลำดับเหตุการณ์ + คำถามเชิงลึก"}
  },
  play(level, ctx){
    ctx.stage.innerHTML = `<div class="map" id="mp">${ICONS.map(i=>`<i>${i}</i>`).join("")}</div><div id="host"></div>`;
    const $ = s => ctx.stage.querySelector(s), host = $("#host");
    let items;
    if (level === 1) items = shuffle(B1.slice()).slice(0,N).map(q => ({t:"q", q}));
    else if (level === 2) items = shuffle(B2.slice()).slice(0,N).map(q => ({t:"q", q}));
    else { const qs = shuffle(B3.slice()).slice(0,4).concat(shuffle(B2.slice()).slice(0,3)).map(q => ({t:"q", q})); items = shuffle([...qs, {t:"o"}, {t:"o"}, {t:"o"}]); }
    let idx = 0;
    const done = () => { $("#mp").children[idx].classList.add("on"); idx++; ctx.progress(idx, N); next(); };
    function next(){
      if (idx >= N){ ctx.finish({targetSec: level===3 ? 180 : 110}); return; }
      const it = items[idx];
      if (it.t === "q"){
        const [text, ans, wr, ex] = it.q; const o = shuffle([ans, ...wr]);
        KIT.mcq(ctx, host, {label:`ข้อ ${idx+1} จาก ${N}`, html:text, options:o.map(KIT.esc), answer:o.indexOf(ans), cols:level===1 ? 1 : 2, explain:`ยังไม่ใช่ — ${ex}`, onNext:done});
      } else order();
    }
    function order(){
      /* 4 events in true order, shown shuffled */
      const drop = Math.floor(Math.random()*TL.length);
      const ev = TL.map((e,i)=>({e,i})).filter(x => x.i !== drop);
      host.innerHTML = `<div class="qcard"><div class="qlabel">ข้อ ${idx+1} จาก ${N} · เรียงเหตุการณ์</div><div class="qtext">แตะเหตุการณ์ที่เกิด <u>ก่อน</u> ไปหา <u>หลัง</u></div></div>
        <div class="ord">${shuffle(ev.slice()).map(x=>`<button class="ob" type="button" data-i="${x.i}"><span class="n">?</span><span>${x.e[0]}</span><span class="y"></span></button>`).join("")}</div>`;
      const want = ev.map(x=>x.i); let k = 0, first = true;
      host.querySelector(".ord").onclick = e => {
        const b = e.target.closest(".ob"); if (!b || b.classList.contains("done") || k >= want.length) return;
        if (+b.dataset.i === want[k]){
          b.classList.add("done"); k++; b.querySelector(".n").textContent = k; b.querySelector(".y").textContent = TL[+b.dataset.i][1]; KIT.sfx.tap();
          if (k === want.length){ ctx.correct(first ? 150 : 80, "เรียงถูกทั้งหมด! เก่งมาก"); ctx.after(1500, done); }
        } else {
          first = false; b.classList.remove("no"); void b.offsetWidth; b.classList.add("no");
          ctx.wrong("ยังไม่ใช่ลำดับนี้ ลองคิดว่าเหตุการณ์ไหนเกิดก่อน");
        }
      };
    }
    ctx.progress(0, N); ctx.say("ออกเดินทางสู่สุโขทัยกัน!");
    next();
  }
});
})();
</script>

</html>
