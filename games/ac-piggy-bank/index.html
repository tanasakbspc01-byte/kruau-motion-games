<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กระปุกพอเพียง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
.wal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.wal span{background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.wal span.bad{border-color:#E06767;color:#C24545}
.wal span.good{border-color:#3FAE6A;color:#2C8A52}
.need{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.need i{font-style:normal;background:#FFF1C9;border-radius:999px;padding:2px 12px;font-weight:700}
.need i.ok{background:#CFF0DA}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;width:100%}
.g{border:3px solid var(--line);background:#fff;border-radius:16px;padding:8px 6px;font-weight:700;box-shadow:0 4px 0 var(--line);line-height:1.3;font-size:clamp(.8rem,2.5vw,1rem)}
.g .e{display:block;font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.1}
.g .p{display:inline-block;margin-top:4px;background:#F6CD6B;border-radius:999px;padding:0 10px;font-variant-numeric:tabular-nums}
.g.in{border-color:var(--c);background:#EEF5FF;transform:translateY(-3px);box-shadow:0 6px 0 var(--c)}
.pay{display:flex;justify-content:center;margin-top:14px}
.pay .btn{font-size:1.2rem;padding:12px 28px}
.pig{font-size:2rem;text-align:center}

</style>
</head>
<body>
<script src="kit.js"></script>
<script>
(function(){
const {shuffle, rand, pick} = KIT;
const ROUNDS = 5;
/* need: [name, cheap, fancy]  item: [icon, label, price] */
const NEEDS = [
  ["ดินสอ",["✏️","ดินสอไม้",5],["🖍️","ดินสอกดลายการ์ตูน",35]],
  ["สมุด",["📒","สมุดปกธรรมดา",10],["📔","สมุดปกการ์ตูนนำเข้า",45]],
  ["ข้าวกลางวัน",["🍚","ข้าวราดแกง",25],["🍕","พิซซ่าชุดใหญ่",120]],
  ["น้ำดื่ม",["💧","น้ำเปล่า",7],["🧋","ชานมไข่มุก",45]],
  ["ยางลบ",["⬜","ยางลบก้อนเล็ก",3],["🍓","ยางลบหอมรูปผลไม้",25]],
  ["ไม้บรรทัด",["📏","ไม้บรรทัดพลาสติก",8],["📐","ชุดไม้บรรทัดเหล็ก",60]]
];
const WANTS = [["🧸","ตุ๊กตา",59],["🃏","การ์ดเกม",30],["🍭","อมยิ้ม",10],["🍟","ขนมกรุบกรอบ",20],["🎈","ลูกโป่ง",15],["🪀","โยโย่",25],["🔫","ปืนฉีดน้ำ",40]];
const LV = {1:{need:[2,2], save:[10,20], slack:[20,30], wants:3}, 2:{need:[2,3], save:[15,30], slack:[6,14], wants:4}, 3:{need:[3,3], save:[20,40], slack:[0,4], wants:5}};

KIT.mount({
  key:"ac-shop", title:"กระปุกพอเพียง", subtitle:"การป้องกันการทุจริต ป.4 · หน่วยที่ 3 จิตพอเพียง (S = Sufficient)",
  heroHTML:"ซื้อของ<em>พอเพียง</em> เหลือเงินออม 🐷", heroDesc:"มีเงินจำกัด ต้องซื้อของที่จำเป็นให้ครบ และเหลือเงินหยอดกระปุกตามเป้าหมาย คิดก่อนซื้อ รู้จักพอ",
  progIcon:"🐷",
  howto:["ดูรายการของที่จำเป็นต้องซื้อ และเป้าหมายเงินออม","แตะสินค้าเพื่อใส่ตะกร้า (แตะซ้ำเพื่อเอาออก)","ซื้อของจำเป็นให้ครบ และเงินเหลือไม่น้อยกว่าเป้าหมาย","กด \"จ่ายเงิน\" ผ่านครบ 5 วันผ่านด่าน"],
  levels:{
    1:{pill:"5 วัน", color:"var(--green)", desc:"ของจำเป็น 2 อย่าง เงินพอใช้สบาย"},
    2:{pill:"5 วัน", color:"var(--blue)", desc:"ของจำเป็น 2–3 อย่าง ต้องเลือกแบบประหยัด"},
    3:{pill:"5 วัน", color:"var(--purple)", desc:"ของจำเป็น 3 อย่าง เงินพอดีมาก ต้องคิดให้ดี"}
  },
  play(level, ctx){
    const L = LV[level];
    ctx.stage.innerHTML = `<div class="qcard"><div class="qlabel" id="qn"></div><div class="pig">🐷</div>
      <div class="wal"><span id="mo"></span><span id="sp"></span><span id="lf"></span><span id="gl"></span></div>
      <div class="need" id="nd"></div></div>
      <div class="shelf" id="sh"></div>
      <div class="pay"><button class="btn" type="button" id="pay">💳 จ่ายเงิน</button></div>`;
    const $ = s => ctx.stage.querySelector(s);
    let day = 0, cur, basket = new Set(), first = true;
    function newDay(){
      if (day >= ROUNDS){ ctx.finish({targetSec: 150}); return; }
      const needs = shuffle(NEEDS.slice()).slice(0, rand(L.need[0], L.need[1]));
      const cheap = needs.reduce((s,n) => s + n[1][2], 0);
      const save = rand(L.save[0]/5, L.save[1]/5)*5, money = Math.ceil((cheap + save + rand(L.slack[0], L.slack[1]))/5)*5;
      const goods = shuffle([...needs.flatMap((n,i) => [{...arr(n[1]), need:i}, {...arr(n[2]), need:i}]), ...shuffle(WANTS.slice()).slice(0, L.wants).map(w => ({...arr(w), need:-1}))]);
      cur = {needs, save, money, goods}; basket = new Set(); first = true;
      $("#qn").textContent = `วันที่ ${day+1} จาก ${ROUNDS}`;
      $("#nd").innerHTML = "ต้องซื้อ: " + needs.map((n,i)=>`<i data-n="${i}">${n[0]}</i>`).join("");
      $("#sh").innerHTML = goods.map((g,i)=>`<button class="g" type="button" data-i="${i}"><span class="e">${g.icon}</span>${g.label}<br><span class="p">${g.price} ฿</span></button>`).join("");
      upd();
    }
    const arr = a => ({icon:a[0], label:a[1], price:a[2]});
    const spent = () => [...basket].reduce((s,i) => s + cur.goods[i].price, 0);
    function upd(){
      const sp = spent(), left = cur.money - sp;
      $("#mo").textContent = `💰 มีเงิน ${cur.money} ฿`; $("#sp").textContent = `🧺 ใช้ไป ${sp} ฿`;
      $("#lf").textContent = `เหลือ ${left} ฿`; $("#gl").textContent = `🎯 ต้องออม ${cur.save} ฿`;
      $("#lf").className = left >= cur.save ? "good" : "bad";
      const have = new Set([...basket].map(i => cur.goods[i].need));
      ctx.stage.querySelectorAll("#nd i").forEach(x => x.classList.toggle("ok", have.has(+x.dataset.n)));
      ctx.stage.querySelectorAll(".g").forEach(b => b.classList.toggle("in", basket.has(+b.dataset.i)));
    }
    $("#sh").addEventListener("click", e => {
      const b = e.target.closest(".g"); if (!b) return; const i = +b.dataset.i;
      basket.has(i) ? basket.delete(i) : basket.add(i); KIT.sfx.tap(); upd();
    });
    $("#pay").onclick = () => {
      const have = new Set([...basket].map(i => cur.goods[i].need));
      const miss = cur.needs.filter((n,i) => !have.has(i)).map(n => n[0]);
      const left = cur.money - spent();
      if (miss.length){ first = false; ctx.wrong(`ยังไม่ได้ซื้อของจำเป็น: ${miss.join(", ")}`); return; }
      if (left < cur.save){ first = false; ctx.wrong(`ใช้เงินเกินไป ${cur.save - left} บาท ยังออมไม่ถึงเป้า ลองเลือกของที่ประหยัดกว่า หรือเอาของที่ไม่จำเป็นออก`); return; }
      const extra = left - cur.save;
      ctx.correct((first ? 100 : 60) + Math.min(40, extra*2), `พอเพียง! หยอดกระปุกได้ ${left} บาท 🐷`);
      day++; ctx.progress(day, ROUNDS); ctx.after(1500, newDay);
    };
    ctx.progress(0, ROUNDS); ctx.say("คิดก่อนซื้อ ซื้อเท่าที่จำเป็นนะ");
    newDay();
  }
});

})();
</script>
</body>
</html>
