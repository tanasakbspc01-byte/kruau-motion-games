<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปลาทวนกระแส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
.sea{position:relative;width:100%;height:240px;border-radius:28px;background:linear-gradient(#BFE6FA,#7FC4EA);border:3px solid #fff;box-shadow:0 6px 0 rgba(79,169,216,.35);display:grid;place-items:center;overflow:hidden}
.sea::before{content:"";position:absolute;inset:auto 0 0 0;height:38px;background:repeating-radial-gradient(circle at 20px 50px,#F2DDB0 0 18px,#EBD09A 19px 26px)}
.school{display:flex;gap:6px;align-items:center;position:relative;z-index:1;transition:margin .2s}
.school.in{animation:swim .25s}
.school.no{animation:shk .35s}
.fish{width:clamp(54px,15vw,96px);height:auto}
.fish.mid{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #fff)}
.tlim{position:absolute;left:16px;right:16px;top:12px;height:8px;background:rgba(255,255,255,.5);border-radius:6px;overflow:hidden}
.tlim i{display:block;height:100%;width:0;background:#F2A65A}
.arrows{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ar{border:none;border-radius:24px;padding:20px 0;font-size:3rem;background:#fff;box-shadow:0 6px 0 var(--line),0 0 0 3px var(--line) inset}
.ar:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line),0 0 0 3px var(--line) inset}
@keyframes swim{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes shk{25%{translate:-8px 0}75%{translate:8px 0}}

</style>
</head>
<body>
<script src="kit.js"></script>
<script>
(function(){
const {rand, pick} = KIT;
const LV = {1:{n:20, same:.6, limit:0, red:0}, 2:{n:28, same:.4, limit:2200, red:0}, 3:{n:30, same:.4, limit:1800, red:.3}};
const fish = (col, dir, mid) => `<svg class="fish${mid ? " mid" : ""}" viewBox="0 0 100 60" style="transform:scaleX(${dir})" aria-hidden="true">
  <path d="M22 30 L3 10 L3 50 Z" fill="${col}" stroke="#2F4A60" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="54" cy="30" rx="38" ry="22" fill="${col}" stroke="#2F4A60" stroke-width="3"/>
  <path d="M44 10 q10 -10 22 0" fill="${col}" stroke="#2F4A60" stroke-width="3"/>
  <circle cx="76" cy="25" r="5" fill="#fff"/><circle cx="77" cy="25" r="2.6" fill="#2F4A60"/>
  <path d="M40 22 q-6 8 0 16" fill="none" stroke="#2F4A60" stroke-width="2.5" opacity=".5"/></svg>`;

KIT.mount({
  key:"f-flanker", title:"ปลาทวนกระแส", subtitle:"เกมฝึกสมาธิ · ฝึกจดจ่อและไม่วอกแวก",
  heroHTML:"ดูแค่<em>ปลาตัวกลาง</em> 🐟", heroDesc:"ฝูงปลาว่ายมา 5 ตัว ให้กดลูกศรตามทิศที่ปลาตัวกลางหันไป ปลาข้าง ๆ อาจหันสวนทางเพื่อหลอก ต้องไม่วอกแวก",
  progIcon:"🐟",
  howto:["มองปลาตัวกลาง (ตัวสีเหลือง)","ปลาหันซ้าย กด ⬅️ ปลาหันขวา กด ➡️ (ใช้ปุ่มลูกศรบนคีย์บอร์ดก็ได้)","ยิ่งตอบเร็วยิ่งได้คะแนนมาก","ด่านยาก: ถ้าปลาตัวกลางเป็น 🔴 สีแดง ให้กดทิศตรงข้าม!"],
  note:"เกมนี้ดัดแปลงจากแบบทดสอบ Flanker ที่ใช้ฝึกการจดจ่อกับสิ่งสำคัญ และไม่สนใจสิ่งรบกวน",
  levels:{
    1:{pill:"20 ฝูง", color:"var(--green)", desc:"ปลาส่วนใหญ่หันทางเดียวกัน ไม่จับเวลาต่อข้อ"},
    2:{pill:"28 ฝูง", color:"var(--blue)", desc:"ปลาหันสวนทางบ่อยขึ้น ต้องตอบภายใน 2.2 วินาที"},
    3:{pill:"30 ฝูง", color:"var(--purple)", desc:"ปลาแดงให้กดทิศตรงข้าม ต้องตอบภายใน 1.8 วินาที"}
  },
  play(level, ctx){
    const L = LV[level];
    let t = 0, lock = true, cur = null, shown = 0, timer = null, rtSum = 0, right = 0;
    ctx.stage.innerHTML = `<div class="sea" id="sea"><div class="school" id="sc"></div><div class="tlim" id="tl"><i></i></div></div>
      <div class="arrows"><button class="ar" type="button" data-d="-1" aria-label="ซ้าย">⬅️</button><button class="ar" type="button" data-d="1" aria-label="ขวา">➡️</button></div>`;
    const $ = s => ctx.stage.querySelector(s);
    function next(){
      if (t >= L.n){ ctx.say(`ครบแล้ว! ถูก ${right} จาก ${L.n} · เฉลี่ยข้อละ ${right ? (rtSum/right/1000).toFixed(2) : "-"} วินาที`, "good"); ctx.finish({targetSec:0}); return; }
      const dir = pick([-1,1]), same = Math.random() < L.same, red = Math.random() < L.red;
      const side = same ? dir : -dir;
      cur = {dir, red, ans: red ? -dir : dir};
      const cols = ["#86C5F0","#86C5F0","#F6CD6B","#86C5F0","#86C5F0"];
      $("#sc").innerHTML = [0,1,2,3,4].map(i => fish(i === 2 ? (red ? "#E85A5A" : "#F6CD6B") : cols[i], i === 2 ? dir : side, i === 2)).join("");
      $("#sc").style.marginTop = level === 3 ? rand(-40,40) + "px" : "0";
      $("#sc").classList.remove("in"); void $("#sc").offsetWidth; $("#sc").classList.add("in");
      lock = false; shown = Date.now();
      if (L.limit){ const bar = $("#tl i"); bar.style.transition = "none"; bar.style.width = "100%"; void bar.offsetWidth; bar.style.transition = `width ${L.limit}ms linear`; bar.style.width = "0%";
        timer = ctx.after(L.limit, () => { if (!lock){ lock = true; t++; ctx.progress(t, L.n); ctx.wrong("ช้าไปนิด! ปลาว่ายผ่านไปแล้ว", 5); ctx.after(500, next); } }); }
    }
    function answer(d){
      if (lock) return; lock = true; clearTimeout(timer); t++;
      const rt = Date.now() - shown;
      if (d === cur.ans){ right++; rtSum += rt; ctx.correct(Math.round(10 + Math.max(0, 1500 - rt)/60), rt < 600 ? "ไวมาก! ⚡" : "ถูก!"); ctx.progress(t, L.n); ctx.after(250, next); }
      else { $("#sc").classList.add("no"); ctx.wrong(cur.red ? "ปลาแดง ต้องกดทิศตรงข้ามนะ" : "ดูปลาตัวกลางเท่านั้นนะ", 5); ctx.progress(t, L.n); ctx.after(700, () => { $("#sc").classList.remove("no"); next(); }); }
    }
    ctx.stage.querySelector(".arrows").onclick = e => { const b = e.target.closest(".ar"); if (b) answer(+b.dataset.d); };
    const key = e => { if (!ctx.alive()) return; if (e.key === "ArrowLeft"){ e.preventDefault(); answer(-1); } else if (e.key === "ArrowRight"){ e.preventDefault(); answer(1); } };
    document.addEventListener("keydown", key); ctx.cleanup(() => document.removeEventListener("keydown", key));
    ctx.progress(0, L.n); ctx.say("ฝูงปลากำลังมา… มองตัวกลาง!");
    ctx.after(1200, next);
  }
});

})();
</script>
</body>
</html>
