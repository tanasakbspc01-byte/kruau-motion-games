<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ครูคุมสอบตาไว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
.room{display:grid;gap:12px;margin-top:12px;width:100%;background:#E9DCC6;border-radius:24px;padding:14px;box-sizing:border-box;box-shadow:0 6px 0 #D2C0A2}
.desk{position:relative;border:none;background:#C8A27A;border-radius:14px;padding:10px 6px 12px;min-height:120px;box-shadow:0 5px 0 #A47F59;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden}
.desk .kid{font-size:clamp(2rem,7vw,2.8rem);line-height:1}
.desk .act{font-size:clamp(.78rem,2.4vw,.95rem);font-weight:700;background:#fff;border-radius:10px;padding:2px 6px;margin-top:4px;min-height:1.4em;line-height:1.3}
.desk .bub{position:absolute;top:6px;right:8px;font-size:1.5rem;opacity:0;transform:scale(.4);transition:.15s}
.desk.on .bub{opacity:1;transform:scale(1)}
.desk.on{background:#F3C9A0}
.desk.caught{background:#BFE8CF;box-shadow:0 5px 0 #7FC79A}
.desk.oops{animation:shake .4s;background:#F6B4B4}
.teacher{text-align:center;font-weight:700;color:var(--ink-soft);margin-top:6px}

</style>
</head>
<body>
<script src="kit.js"></script>
<script>
(function(){
const {pick, rand, shuffle} = KIT;
const NEED = 12;
const HONEST = [["✍️","ตั้งใจทำข้อสอบ"],["🤔","คิดคำตอบ"],["📖","อ่านโจทย์"],["✏️","เขียนคำตอบ"]];
const CHEAT = [["👀","แอบดูข้อสอบเพื่อน"],["🗣️","คุยกันในห้องสอบ"],["🙊","ถามคำตอบเพื่อน"],["📝","ส่งโพยให้เพื่อน"],["📱","แอบเปิดโทรศัพท์"],["🔊","อ่านข้อสอบเสียงดัง"],["🖐️","ให้เพื่อนลอกคำตอบ"]];
/* honest actions that look suspicious (level 3) */
const TRICK = [["🙋","ยกมือถามครู"],["✏️","ขอยืมยางลบจากครู"],["🙋","ยกมือขอไปห้องน้ำ"]];
const KIDS = ["👦","👧","🧒","👦🏻","👧🏻","🧒🏻","👦🏽","👧🏽","🧒🏽"];
const LV = {1:{n:6, cols:3, up:2600, gap:900}, 2:{n:9, cols:3, up:2000, gap:700}, 3:{n:9, cols:3, up:1600, gap:550, trick:true}};

KIT.mount({
  key:"ac-exam", title:"ครูคุมสอบตาไว", subtitle:"การป้องกันการทุจริต ป.4 · หน่วยที่ 2 ความละอายและไม่ทนต่อการทุจริต (การสอบ)",
  heroHTML:"เป็น<em>ครูคุมสอบ</em> จับคนทุจริต 👩‍🏫", heroDesc:"นักเรียนกำลังสอบ ใครทำผิดกติกาให้แตะเตือนทันที แต่อย่าแตะคนที่ตั้งใจทำข้อสอบนะ",
  progIcon:"👩‍🏫",
  howto:["ดูนักเรียนแต่ละโต๊ะ","เห็นใครทำผิดกติกาการสอบ (มีป้ายบอก) ให้แตะเตือน","แตะคนที่ทำถูกต้องเสีย 10 คะแนน","เตือนครบ 12 ครั้งผ่านด่าน"],
  levels:{
    1:{pill:"6 โต๊ะ", color:"var(--green)", desc:"ช้า ๆ ดูทันสบาย"},
    2:{pill:"9 โต๊ะ", color:"var(--blue)", desc:"เร็วขึ้น โต๊ะมากขึ้น"},
    3:{pill:"9 โต๊ะ", color:"var(--purple)", desc:"เร็ว และมีท่าทางที่ดูเหมือนผิดแต่ถูก เช่น ยกมือถามครู"}
  },
  play(level, ctx){
    const L = LV[level];
    const kids = shuffle(KIDS.slice());
    ctx.stage.innerHTML = `<div class="qcard"><div class="qlabel">ข้อปฏิบัติในการสอบ: ไม่คุย ไม่ถามเพื่อน ไม่แอบดู ไม่ให้เพื่อนลอก ไม่อ่านเสียงดัง</div><div class="qtext">แตะเตือนคนที่ทำผิดกติกา</div></div>
      <div class="room" id="rm" style="grid-template-columns:repeat(${L.cols},1fr)">${Array.from({length:L.n},(_,i)=>`<button class="desk" type="button" data-i="${i}"><span class="bub"></span><span class="kid">${kids[i]}</span><span class="act"></span></button>`).join("")}</div>
      <div class="teacher">👩‍🏫 ครูคุมสอบ: <span id="ct">0</span>/${NEED}</div>`;
    const $ = s => ctx.stage.querySelector(s);
    const desks = [...ctx.stage.querySelectorAll(".desk")];
    const st = desks.map(() => ({cheat:false, trick:false, t:0}));
    let caught = 0, timer = 0;
    function calm(i){
      st[i] = {cheat:false, trick:false, t:0};
      const h = pick(HONEST); const d = desks[i];
      d.classList.remove("on","caught","oops"); d.querySelector(".bub").textContent = ""; d.querySelector(".act").textContent = h[0] + " " + h[1];
    }
    desks.forEach((_,i) => calm(i));
    function spawn(){
      if (!ctx.alive()) return;
      const free = st.map((s,i) => (s.cheat || s.trick || s.busy) ? -1 : i).filter(i => i >= 0);
      if (free.length > 1){
        const i = pick(free), d = desks[i];
        const trick = L.trick && Math.random() < .3;
        const a = trick ? pick(TRICK) : pick(CHEAT);
        st[i] = {cheat:!trick, trick, t:0};
        d.classList.add("on"); d.querySelector(".bub").textContent = trick ? "🙋" : "❗"; d.querySelector(".act").textContent = a[0] + " " + a[1];
        clearTimeout(st[i].t); const mine = st[i];
        mine.t = setTimeout(() => { if (ctx.alive() && st[i] === mine) calm(i); }, L.up + rand(0,400));
      }
      timer = ctx.after(L.gap + rand(0,300), spawn);
    }
    ctx.cleanup(() => st.forEach(s => clearTimeout(s.t)));
    $("#rm").addEventListener("pointerdown", e => {
      const d = e.target.closest(".desk"); if (!d) return; e.preventDefault();
      const i = +d.dataset.i, s = st[i];
      if (d.classList.contains("caught")) return;
      if (s.cheat){
        clearTimeout(s.t); st[i] = {cheat:false, trick:false, t:0, busy:true};
        d.classList.add("caught"); d.querySelector(".bub").textContent = "✅"; d.querySelector(".act").textContent = "🙏 ขอโทษครับ/ค่ะ";
        caught++; $("#ct").textContent = caught; ctx.correct(100, "เตือนได้ทัน! การสอบต้องซื่อสัตย์"); ctx.progress(caught, NEED);
        ctx.after(700, () => calm(i));
        if (caught >= NEED) ctx.finish({targetSec: level===1 ? 70 : 55});
      } else {
        d.classList.remove("oops"); void d.offsetWidth; d.classList.add("oops");
        ctx.wrong(s.trick ? "ยกมือถามครูหรือขออนุญาต เป็นสิ่งที่ทำได้ ไม่ผิดกติกา" : "นักเรียนคนนี้ตั้งใจทำข้อสอบอยู่นะ");
      }
    });
    ctx.progress(0, NEED); ctx.say("เริ่มสอบได้! คอยสังเกตให้ดี");
    ctx.after(800, spawn);
  }
});

})();
</script>
</body>
</html>
