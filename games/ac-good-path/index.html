<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทางแยกคนดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
.road{position:relative;height:64px;margin:4px 0 6px;background:linear-gradient(#CDEBC5,#B7DDAE);border-radius:18px;overflow:hidden}
.road .st{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#E8D7BE;transform:translate(-50%,-50%);box-shadow:inset 0 -3px 0 #CDB894}
.road .st.on{background:#F6CD6B;box-shadow:inset 0 -3px 0 #E0A93C}
.road .hero{position:absolute;top:50%;font-size:34px;transform:translate(-50%,-62%);transition:left .6s ease}
.road .goal{position:absolute;right:8px;top:50%;transform:translateY(-55%);font-size:34px}
.scene{font-size:clamp(2.4rem,9vw,3.4rem);text-align:center;line-height:1}
.tag{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:1px 12px;font-size:.8rem;font-weight:700;margin-bottom:4px}
.choice{text-align:left}

</style>
</head>
<body>
<script src="kit.js"></script>
<script>
(function(){
const {shuffle} = KIT;
const N = 8;
/* [topic, icon, situation, best, [wrong...], why] */
const EASY = [
  ["การบ้าน","📒","ครูให้การบ้านคณิตศาสตร์ แต่เราอยากดูการ์ตูน","ทำการบ้านให้เสร็จก่อน แล้วค่อยดูการ์ตูน",["ขอลอกการบ้านเพื่อนพรุ่งนี้เช้า"],"ทำด้วยตัวเองจะเข้าใจบทเรียน"],
  ["การบ้าน","🤔","ทำการบ้านข้อหนึ่งไม่ได้","ถามครูหรือผู้ปกครองให้ช่วยอธิบาย",["เขียนคำตอบมั่ว ๆ ให้เสร็จ ๆ"],"การถามทำให้เข้าใจจริง"],
  ["การทำเวร","🧹","วันนี้เป็นเวรของเรา แต่เพื่อนชวนไปเล่น","ทำเวรให้เสร็จก่อน แล้วค่อยไปเล่น",["แอบหนีไปเล่น ให้เพื่อนทำแทน"],"เวรเป็นหน้าที่ที่ต้องรับผิดชอบ"],
  ["การทำเวร","🗑️","ถังขยะในห้องเต็มแล้ว","นำขยะไปทิ้งที่จุดทิ้งขยะของโรงเรียน",["วางขยะกองไว้ข้างถัง"],"ห้องเรียนจะได้สะอาด"],
  ["การสอบ","📝","ระหว่างสอบ เพื่อนส่งกระดาษคำตอบมาให้","ไม่รับ และตั้งใจทำข้อสอบเอง",["รับมาลอก เพราะไม่มีใครเห็น"],"การลอกข้อสอบเป็นการทุจริต"],
  ["การสอบ","🗣️","ระหว่างสอบ อยากถามคำตอบเพื่อน","ไม่ถามเพื่อน ทำเท่าที่ทำได้ด้วยตัวเอง",["กระซิบถามเพื่อนเบา ๆ"],"การถามเพื่อนระหว่างสอบไม่ซื่อสัตย์"],
  ["การแต่งกาย","👕","ตื่นสาย รีบมาโรงเรียน","แต่งกายให้เรียบร้อยถูกระเบียบก่อนออกจากบ้าน",["ใส่ชุดอะไรก็ได้ ไม่มีใครสนใจ"],"แต่งกายถูกระเบียบเป็นการเคารพกฎของโรงเรียน"],
  ["การเข้าแถว","🧍","เข้าแถวซื้ออาหารกลางวัน แถวยาวมาก","ต่อแถวตามลำดับ",["แทรกแถวตรงที่เพื่อนยืนอยู่"],"ทุกคนรอคิวเหมือนกัน"],
  ["การเข้าแถว","🇹🇭","ตอนเช้าแดดร้อนมาก","เข้าแถวเคารพธงชาติตามเวลา",["หลบไปนั่งในห้องเรียน ไม่เข้าแถว"],"การเข้าแถวเป็นระเบียบของโรงเรียน"],
  ["กิจกรรมนักเรียน","🏆","แข่งกีฬาสี ทีมเรากำลังจะแพ้","เล่นต่ออย่างเต็มที่และยอมรับผลการแข่งขัน",["โกงกติกาเพื่อให้ชนะ"],"มีน้ำใจนักกีฬา ไม่โกง"]
];
const MID = [
  ["การบ้าน","📱","เพื่อนส่งรูปการบ้านที่ทำเสร็จแล้วมาในไลน์ให้ลอก","ขอบคุณเพื่อน แต่ทำการบ้านด้วยตัวเอง",["ลอกไปส่งครู","ลอกแล้วเปลี่ยนคำตอบนิดหน่อยไม่ให้ครูรู้"],"การลอกทำให้ไม่ได้ความรู้ และไม่ซื่อสัตย์"],
  ["การทำเวร","⏰","เพื่อนบางคนมาสายเพราะไม่อยากทำเวร","ชวนเพื่อนมาทำเวรด้วยกัน และแบ่งงานกันให้ยุติธรรม",["ไม่ทำบ้าง ปล่อยห้องสกปรก","ทำเวรแทนเพื่อนแล้วขอเงินค่าจ้าง"],"เวรเป็นหน้าที่ของทุกคนในกลุ่ม"],
  ["การสอบ","📄","เห็นข้อสอบที่ครูวางลืมไว้บนโต๊ะก่อนสอบ","ไม่เปิดดู และบอกครูว่าลืมไว้",["แอบถ่ายรูปไว้ดู","จำไปบอกเพื่อน ๆ"],"การแอบดูข้อสอบเป็นการทุจริต"],
  ["การสอบ","🤝","เพื่อนสนิทขอให้ช่วยบอกคำตอบตอนสอบ","ปฏิเสธดี ๆ และชวนเพื่อนอ่านหนังสือด้วยกันก่อนสอบ",["บอกคำตอบเพราะเป็นเพื่อนสนิท","ยื่นกระดาษคำตอบให้ดูแค่ข้อเดียว"],"เพื่อนที่ดีช่วยกันเรียน ไม่ช่วยกันโกง"],
  ["การแต่งกาย","👟","รองเท้านักเรียนขาด เพื่อนบอกให้ใส่รองเท้าแฟชั่นมาแทน","บอกครูและผู้ปกครองตามความจริง",["ใส่รองเท้าแฟชั่นแล้วโกหกว่าลืม","ไม่มาโรงเรียน"],"การพูดความจริงคือความซื่อสัตย์"],
  ["การเข้าแถว","📋","หัวหน้าแถวต้องเช็กชื่อ เพื่อนสนิทไม่มาเข้าแถว","บันทึกตามความเป็นจริงว่าเพื่อนไม่มา",["เช็กชื่อว่ามาให้เพื่อน","ไม่เช็กชื่อใครเลย"],"ต้องทำหน้าที่ตรงไปตรงมา ไม่ช่วยพวกพ้อง"],
  ["กิจกรรมนักเรียน","🗳️","เลือกตั้งประธานนักเรียน มีผู้สมัครแจกขนมให้เลือกเขา","เลือกคนที่มีความสามารถและซื่อสัตย์",["เลือกคนที่แจกขนมเยอะที่สุด","รับขนมทุกคนแล้วไม่ไปเลือก"],"การแลกของเพื่อให้เลือกเป็นการซื้อเสียง"],
  ["กิจกรรมนักเรียน","🎪","เป็นคนเก็บเงินขายของงานโรงเรียน","จดรายรับรายจ่ายให้ครบและส่งเงินคืนครู",["หยิบเงินไปซื้อขนมนิดหน่อย","ไม่จดบัญชี ไม่มีใครรู้"],"ต้องโปร่งใส ตรวจสอบได้"]
];
const HARD = [
  ["การสอบ","🤫","เพื่อนบอกว่าจะลอกข้อสอบ และขอให้เราสัญญาว่าจะไม่บอกครู","ไม่สัญญา บอกเพื่อนว่าการลอกไม่ดี และชวนอ่านหนังสือด้วยกัน",["สัญญาเพราะกลัวเพื่อนโกรธ","สัญญาแล้วไปแอบฟ้องครูทีหลัง"],"ไม่ทนต่อการทุจริต และช่วยเพื่อนแบบเพื่อนที่ดี"],
  ["การบ้าน","🎮","สัญญากับแม่ว่าทำการบ้านเสร็จก่อนเล่น แต่เพื่อนมาชวนเล่นเกมตอนนี้","บอกเพื่อนว่าสัญญากับแม่ไว้ ไว้วันหลังค่อยเล่นด้วยกัน",["ไปเล่นก่อน แล้วบอกแม่ว่าทำเสร็จแล้ว","ไปเล่นแล้วค่อยลอกการบ้านเพื่อน"],"รักษาสัญญาและพูดกับเพื่อนอย่างสุภาพ"],
  ["การทำเวร","🧽","เพื่อนในกลุ่มเวรเสนอว่าใครให้ขนม จะได้ไม่ต้องทำเวร","ไม่เห็นด้วย ให้ทุกคนทำเวรตามหน้าที่",["ตกลง เพราะได้ขนมฟรี","ให้ขนมเพื่อนเพื่อไม่ต้องทำเวร"],"การรับของเพื่อแลกกับการไม่ทำหน้าที่เป็นการทุจริต"],
  ["การเข้าแถว","🍬","เป็นเวรหน้าประตู เพื่อนให้ขนมเพื่อไม่ให้จดชื่อว่ามาสาย","ไม่รับขนม และจดชื่อตามความจริง",["รับขนมแล้วไม่จดชื่อ","ไม่รับขนม แต่ไม่จดชื่อเพราะเป็นเพื่อน"],"ทำหน้าที่ซื่อตรง ไม่รับสินบน"],
  ["กิจกรรมนักเรียน","🏅","เราเป็นกรรมการตัดสินประกวด และน้องของเราลงแข่งด้วย","บอกครูให้เปลี่ยนกรรมการในรอบที่น้องแข่ง",["ให้คะแนนน้องสูงกว่าคนอื่น","ตัดสินเองโดยไม่บอกใคร"],"หลีกเลี่ยงผลประโยชน์ทับซ้อน"],
  ["การแต่งกาย","✂️","เห็นเพื่อนถูกครูตักเตือนเรื่องทรงผม แล้วเพื่อนขอให้ช่วยโกหกครู","ไม่โกหก แนะนำให้เพื่อนแก้ไขให้ถูกระเบียบ",["ช่วยโกหกว่าตัดผมแล้ว","บอกให้เพื่อนหลบหน้าครู"],"ความซื่อสัตย์สำคัญกว่าการช่วยเพื่อนผิด ๆ"],
  ["การสอบ","📊","ครูให้ตรวจข้อสอบของกันและกัน เพื่อนขอให้เพิ่มคะแนนให้","ตรวจตามเฉลยอย่างตรงไปตรงมา",["เพิ่มคะแนนให้ 2–3 ข้อ","แลกกันเพิ่มคะแนนให้กัน"],"การแก้คะแนนเป็นการทุจริต"],
  ["กิจกรรมนักเรียน","💵","เหลือเงินจากการไปทัศนศึกษาของห้อง","แจ้งครูและเพื่อน ๆ ว่าเหลือเท่าไร แล้วตกลงกันว่าจะใช้อย่างไร",["แบ่งกันเฉพาะคนที่เป็นกรรมการ","เก็บไว้เองเงียบ ๆ"],"เงินของห้องต้องโปร่งใส"]
];

KIT.mount({
  key:"ac-path", title:"ทางแยกคนดี", subtitle:"การป้องกันการทุจริต ป.4 · หน่วยที่ 2 ความละอายและความไม่ทนต่อการทุจริต",
  heroHTML:"เลือกทางที่<em>ซื่อสัตย์</em> พาไปถึงปราสาท 🏰", heroDesc:"เจอสถานการณ์ที่โรงเรียน เรื่องการบ้าน เวร การสอบ การแต่งกาย การเข้าแถว และกิจกรรม เลือกทางที่ถูกต้องเพื่อเดินหน้า",
  progIcon:"🏰",
  howto:["อ่านสถานการณ์","เลือกสิ่งที่ควรทำที่สุด","ตอบถูกจะเดินหน้าไป 1 ช่อง","ถึงปราสาทครบ 8 ช่องผ่านด่าน"],
  levels:{
    1:{pill:"8 ช่อง", color:"var(--green)", desc:"2 ทางเลือก เรื่องใกล้ตัว"},
    2:{pill:"8 ช่อง", color:"var(--blue)", desc:"3 ทางเลือก ต้องคิดมากขึ้น"},
    3:{pill:"8 ช่อง", color:"var(--purple)", desc:"3 ทางเลือก สถานการณ์ยาก ต้องรักษาน้ำใจเพื่อนด้วย"}
  },
  play(level, ctx){
    const bank = shuffle((level===1 ? EASY : level===2 ? MID : HARD).slice()).slice(0,N);
    ctx.stage.innerHTML = `<div class="road" id="rd">${Array.from({length:N},(_,i)=>`<span class="st" style="left:${8 + i*(80/N)}%"></span>`).join("")}<span class="hero" id="hr" style="left:4%">🧒</span><span class="goal">🏰</span></div><div id="host"></div>`;
    const $ = s => ctx.stage.querySelector(s);
    let idx = 0;
    function next(){
      if (idx >= N){ $("#hr").style.left = "92%"; ctx.finish({targetSec: level===1 ? 80 : 130}); return; }
      const [topic, ic, sit, best, wr, why] = bank[idx];
      const o = shuffle([best, ...wr]);
      KIT.mcq(ctx, $("#host"), { label:`ช่องที่ ${idx+1} จาก ${N}`, html:`<span class="tag">${topic}</span><div class="scene">${ic}</div>${KIT.esc(sit)}<br><small style="font-size:.75em;color:var(--ink-soft)">เราควรทำอย่างไร?</small>`,
        options:o.map(KIT.esc), answer:o.indexOf(best), cols:1, explain:`ลองคิดใหม่ — ${why}`,
        onNext(){ ctx.stage.querySelectorAll(".st")[idx].classList.add("on"); $("#hr").style.left = (8 + idx*(80/N)) + "%"; idx++; ctx.progress(idx, N); ctx.after(500, next); } });
    }
    ctx.progress(0, N); ctx.say("เลือกทางที่ซื่อสัตย์นะ!");
    next();
  }
});

})();
</script>
</body>
</html>
