<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Tycoon สวนไม้ดอก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="block.css">
<style>
.yard{display:grid;gap:12px;width:100%;background:#8BD46B;border:4px solid var(--block);border-radius:10px;box-shadow:0 6px 0 var(--block);padding:12px;background-image:linear-gradient(rgba(0,0,0,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.05) 2px,transparent 2px);background-size:24px 24px}
.pot{position:relative;border:none;background:none;padding:28px 4px 4px;display:flex;flex-direction:column;align-items:center;min-height:150px}
.pot .need{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--block);border-radius:8px;padding:2px 8px;font-weight:800;font-size:clamp(.72rem,2.3vw,.9rem);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:none}
.pot.has .need{display:block;animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translate(-50%,-4px)}}
.pot .pl{font-size:clamp(2.4rem,9vw,3.4rem);line-height:1;margin-top:6px}
.pot .bx{width:70%;height:30px;background:#B5713C;border:4px solid var(--block);border-radius:4px 4px 10px 10px;margin-top:-4px}
.pot .nm{font-weight:800;font-size:.85rem;margin-top:4px;background:rgba(255,255,255,.85);border-radius:6px;padding:0 6px}
.pot.ok .pl{animation:grow .5s}
@keyframes grow{50%{transform:scale(1.25)}}
.pot.no{animation:shake .4s}
.hotbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px;background:#1F2A44;border-radius:10px;padding:8px}
.hot{width:clamp(64px,13vw,92px);border:3px solid #4F5B76;background:#2E3B5C;color:#fff;border-radius:6px;padding:6px 2px;font-weight:700;font-size:clamp(.66rem,2vw,.82rem);line-height:1.2}
.hot .e{display:block;font-size:1.7rem}
.hot .k{display:block;font-size:.7rem;opacity:.7}
.hot.on{border-color:#FFD23F;background:#4A5A86;transform:translateY(-4px)}

</style>
</head>
<body>
<script src="kit.js"></script>
<script src="block.js"></script>
<script>
(function(){
const {shuffle, pick, rand} = KIT;
const TOOLS = [
  ["water","🚿","บัวรดน้ำ","รดน้ำ"],["fork","🍴","ส้อมพรวน","พรวนดิน"],["weed","🌿","ถอนวัชพืช","ถอนหญ้า"],
  ["fert","🧪","ปุ๋ย","ใส่ปุ๋ย"],["bug","😷","ฉีดพ่นกำจัดแมลง","สวมผ้าปิดปาก-จมูก"],["cut","✂️","กรรไกรตัดกิ่ง","ตัดดอก"],["trowel","🥄","ช้อนปลูก","ย้ายกล้า"]
];
/* [tool, cue with emoji, cue text only] */
const NEEDS = [
  ["water","🏜️ ดินแห้ง ใบเหี่ยว","ดินแห้ง ใบเหี่ยว"],["water","☀️ แดดจัดมาทั้งวัน ดินแห้ง","ดินแตกระแหง"],
  ["fork","🧱 ดินแน่นแข็ง","ดินแน่น น้ำซึมลงยาก"],
  ["weed","🌱 หญ้าขึ้นรอบต้น","มีวัชพืชแย่งอาหาร"],
  ["fert","🍂 ใบเหลือง โตช้า","ต้นแคระแกร็น ดอกเล็ก"],
  ["bug","🐛 เพลี้ยกินใบ","มีแมลงศัตรูพืช"],
  ["cut","🌼 ดอกบานเต็มที่","ดอกบานพร้อมเก็บ (ตอนเช้า)"],
  ["trowel","🌱 กล้าในถาดโตพร้อมย้าย","ต้นกล้ามีใบจริง 3–4 ใบ"]
];
const PLANTS = [["🌼","ดาวเรือง"],["🌹","กุหลาบ"],["🌺","ชบา"],["🪴","พลูด่าง"],["🌸","มะลิ"],["🌻","ทานตะวัน"]];
const LV = {1:{pots:3, tools:["water","fork","weed","cut"], need:10, emoji:true}, 2:{pots:4, tools:["water","fork","weed","fert","bug","cut"], need:12, emoji:true}, 3:{pots:6, tools:TOOLS.map(t=>t[0]), need:14, emoji:false}};

BK.mount({
  key:"w-garden", title:"Garden Tycoon สวนไม้ดอก", subtitle:"การงานอาชีพ ป.4 · หน่วยที่ 3 ไม้ดอกไม้ประดับ",
  heroHTML:"ดูแล<em>สวนไม้ดอก</em>ให้งาม 🌼", heroDesc:"กระถางไหนมีปัญหาจะมีป้ายขึ้น เลือกเครื่องมือจากแถบด้านล่าง แล้วแตะกระถางนั้นเพื่อดูแลให้ถูกวิธี",
  progIcon:"🌼",
  howto:["ดูป้ายบนกระถางว่าต้นไม้ต้องการอะไร","แตะเครื่องมือในแถบด้านล่าง","แตะกระถางที่ต้องการดูแล","ใช้เครื่องมือผิดเสียหัวใจ ❤️ ดูแลครบตามเป้าผ่านด่าน"],
  levels:{
    1:{pill:"10 ครั้ง", color:"var(--green)", desc:"3 กระถาง 4 เครื่องมือ มีรูปช่วย"},
    2:{pill:"12 ครั้ง", color:"var(--blue)", desc:"4 กระถาง 6 เครื่องมือ เพิ่มใส่ปุ๋ย กำจัดแมลง"},
    3:{pill:"14 ครั้ง", color:"var(--purple)", desc:"6 กระถาง 7 เครื่องมือ ป้ายเป็นคำอธิบายอาการ"}
  },
  play(level, ctx){
    const L = LV[level];
    const tools = TOOLS.filter(t => L.tools.includes(t[0]));
    const needs = NEEDS.filter(n => L.tools.includes(n[0]));
    const plants = shuffle(PLANTS.slice()).slice(0, L.pots);
    while (plants.length < L.pots) plants.push(pick(PLANTS));
    ctx.stage.innerHTML = `<div class="yard" id="yd" style="grid-template-columns:repeat(${L.pots <= 4 ? L.pots : 3},1fr)">${plants.map((p,i)=>`<button class="pot" type="button" data-i="${i}"><span class="need"></span><span class="pl">${p[0]}</span><span class="bx"></span><span class="nm">${p[1]}</span></button>`).join("")}</div>
      <div class="hotbar" id="hb">${tools.map((t,i)=>`<button class="hot" type="button" data-t="${t[0]}"><span class="k">${i+1}</span><span class="e">${t[1]}</span>${t[2]}</button>`).join("")}</div>`;
    const $ = s => ctx.stage.querySelector(s);
    const pots = [...ctx.stage.querySelectorAll(".pot")];
    const state = pots.map(() => null);
    let tool = null, done = 0, lastNeed = null;
    function addOne(){
      const active = state.filter(Boolean).length;
      const free = state.map((s,i) => s ? -1 : i).filter(i => i >= 0);
      if (free.length && active < Math.min(L.pots, 3) && done + active < L.need){
        const i = pick(free); let n; do { n = pick(needs); } while (n === lastNeed && needs.length > 1); lastNeed = n;
        state[i] = n; pots[i].classList.add("has"); pots[i].querySelector(".need").textContent = L.emoji ? n[1] : n[2];
      }
    }
    function spawn(){ if (!ctx.alive() || done >= L.need) return; addOne(); ctx.after(level === 3 ? 1400 : 1900, spawn); }
    $("#hb").addEventListener("click", e => {
      const b = e.target.closest(".hot"); if (!b) return;
      ctx.stage.querySelectorAll(".hot").forEach(x => x.classList.remove("on")); b.classList.add("on"); tool = b.dataset.t; KIT.sfx.tap();
      const t = TOOLS.find(x => x[0] === tool); ctx.say(`ถือ ${t[1]} ${t[2]} — แตะกระถางที่ต้องการ${t[3]}`);
    });
    $("#yd").addEventListener("click", e => {
      const p = e.target.closest(".pot"); if (!p) return; const i = +p.dataset.i, n = state[i];
      if (!n){ ctx.say("กระถางนี้สบายดีแล้ว 😊"); return; }
      if (!tool){ ctx.say("เลือกเครื่องมือจากแถบด้านล่างก่อนนะ"); return; }
      const t = TOOLS.find(x => x[0] === tool);
      if (tool === n[0]){
        state[i] = null; p.classList.remove("has"); p.classList.remove("ok"); void p.offsetWidth; p.classList.add("ok"); done++;
        ctx.correct(100, `ถูกต้อง! ${n[2]} → ${t[3]}`); ctx.progress(done, L.need);
        if (done >= L.need) ctx.finish({targetSec: [0,60,75,95][level]});
      } else {
        p.classList.remove("no"); void p.offsetWidth; p.classList.add("no");
        ctx.wrong(`"${n[2]}" ไม่ต้อง${t[3]} ลองเครื่องมืออื่นนะ`);
      }
    });
    const keyh = e => { const k = +e.key; if (k >= 1 && k <= tools.length) ctx.stage.querySelectorAll(".hot")[k-1].click(); };
    document.addEventListener("keydown", keyh); ctx.cleanup(() => document.removeEventListener("keydown", keyh));
    ctx.progress(0, L.need); ctx.say("เลือกเครื่องมือ แล้วดูแลต้นไม้กันเลย!");
    addOne(); spawn();
  }
});

})();
</script>
</body>
</html>
