<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ใบงานคณิตศาสตร์ ป.3 · ครูอู๋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--main:#2DBE6C;--deep:#1E9E55;--ink:#22302A;--soft:#5E6F67;--line:#D8E6DD;--red:#D93A2F;--bg:#EEF7F1}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Sarabun,system-ui,sans-serif}
.tool{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px max(3vw,10px);background:#fff;border-bottom:3px solid var(--main);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.tool b{font-family:Mali,sans-serif;font-size:18px;color:var(--deep);margin-right:auto}
.tool select,.tool button{font:600 16px Sarabun,sans-serif;min-height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;cursor:pointer}
.tool button.pri{background:var(--main);border-color:var(--main);color:#fff;box-shadow:0 3px 0 var(--deep)}
.tool button.key.on{background:var(--red);border-color:var(--red);color:#fff}
.tool .set{font-size:14px;color:var(--soft);white-space:nowrap}
.sheets{padding:18px max(2vw,8px) 60px}
.page{width:min(210mm,100%);margin:0 auto 18px;background:#fff;border-radius:8px;box-shadow:0 6px 24px rgba(20,60,40,.12);padding:12mm 13mm 14mm;position:relative}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start;border-bottom:3px solid var(--main);padding-bottom:8px;margin-bottom:10px}
.hd h1{font-family:Mali,sans-serif;font-size:24px;line-height:1.2;margin:0;color:var(--deep)}
.hd .sub{font-size:14px;color:var(--soft)}
.hd img{width:78px;height:auto;grid-row:1/3;grid-column:2}
.who{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px;margin:2px 0 4px}
.who span{white-space:nowrap}
.who i{display:inline-block;border-bottom:1.5px dotted #777;width:150px;margin-left:4px}
.who i.s{width:60px}
.score{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--main);border-radius:10px;padding:0 10px;font-weight:700}
.sec{margin:12px 0 6px;break-inside:avoid-page}
.sec h2{font-size:17px;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.sec h2 .n{flex:none;background:var(--main);color:#fff;border-radius:8px;padding:0 9px;font-family:Mali,sans-serif;font-size:15px}
.items{display:grid;gap:8px 22px;margin:0;padding:0 0 0 4px;list-style:none;counter-reset:q}
.items>li{counter-increment:q;position:relative;padding-left:26px;break-inside:avoid}
.items>li::before{content:counter(q) ".";position:absolute;left:0;top:0;font-weight:700;color:var(--soft)}
.c1{grid-template-columns:1fr}.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.work>li{min-height:92px}
.c1.work>li{min-height:70px}
.bl{display:inline-block;min-width:110px;border-bottom:1.5px solid #555;height:1.35em;vertical-align:bottom;margin:0 2px;text-align:center;line-height:1.35}
.bl.sm{min-width:54px}.bl.mid{min-width:190px}.bl.long{min-width:min(100%,440px)}
.key .bl::after{content:attr(data-a);color:var(--red);font-weight:700;font-size:.95em}
.key .bl{border-bottom-color:var(--red);height:auto;min-height:1.35em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 2px;font-size:.92em}
.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:1.5px solid currentColor}
svg.ang{width:210px;height:140px;display:block;margin:2px 0}
svg.clk{width:120px;height:120px;display:block;margin:0 auto}svg.fbar{width:150px;display:block;margin:6px auto}svg.fpie{width:78px;height:78px;display:block;margin:0 auto}svg.sym{width:96px;height:96px;display:block;margin:0 auto}
.cap{text-align:center;line-height:1.9}.big{font:700 30px/1 Sarabun,sans-serif;display:inline-block;min-width:30px}
table.pc{border-collapse:collapse;margin:4px 0;font-size:17px}table.pc caption{font-weight:700;padding:4px}table.pc th{text-align:left;padding:5px 10px;border:1px solid #bbb;background:#F5F7FB;white-space:nowrap}table.pc td{padding:5px 10px;border:1px solid #bbb;font-size:20px;letter-spacing:2px}table.pc td.note{font-size:15px;letter-spacing:0;text-align:right;border:0}
td.tly{font:700 18px/1 monospace;letter-spacing:1px;text-align:left!important}.tl5{text-decoration:line-through;text-decoration-thickness:2px}
svg.rc{width:190px;height:auto;display:block}
svg.rc text{font:13px Sarabun,sans-serif}
svg.qd{width:250px;max-width:100%;height:auto;display:block}svg.qd text{font:14px Sarabun,sans-serif}
svg.grid{width:100%;max-width:520px;display:block}
svg.par{width:320px;max-width:100%;display:block}
svg.pie{width:100%;max-width:420px;display:block}
.angs{margin-top:6px;line-height:2.2}.tip2{font-size:13px;color:var(--soft)}
svg.grid .key{display:none}.key svg.grid .key{display:inline}
.draw{height:110px;border:1.5px dashed #bbb;border-radius:10px;margin-top:6px}
table.dt{border-collapse:collapse;margin:4px 0;font-size:16px}
table.dt th,table.dt td{border:1.5px solid #888;padding:4px 14px;text-align:center}
table.dt th{background:#F1F8F4;text-align:left}
.foot{position:absolute;left:13mm;right:13mm;bottom:6mm;display:flex;justify-content:space-between;font-size:12px;color:#999}
.keytag{display:none;position:absolute;top:26mm;right:14mm;z-index:2;background:#fff;border:3px solid var(--red);color:var(--red);font:700 18px Mali,sans-serif;padding:2px 12px;border-radius:10px;transform:rotate(-6deg)}
.key .keytag{display:block}
.list{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.list a{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);font-weight:700;min-height:64px}
.list a span{font-size:28px}
@media(max-width:640px){table.dt th,table.dt td{padding:3px 6px;font-size:14px}.c3,.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.c2{grid-template-columns:1fr}.page{padding:16px 14px 40px}.hd img{width:56px}.foot{left:14px;right:14px;bottom:10px}}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}.tool,.noprint{display:none!important}.sheets{padding:0}
  .page{width:210mm;min-height:297mm;margin:0;border-radius:0;box-shadow:none;break-after:page}
  .c3{grid-template-columns:repeat(3,minmax(0,1fr))!important}.c4{grid-template-columns:repeat(4,minmax(0,1fr))!important}.c2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="tool">
  <b>📄 ใบงานคณิตศาสตร์ ป.3</b>
  <select id="ch" aria-label="เลือกบท"></select>
  <button id="nw" class="pri" type="button">🎲 สุ่มโจทย์ชุดใหม่</button>
  <button id="ky" class="key" type="button">🔑 เฉลย (ครู)</button>
  <button id="pr" type="button">🖨️ พิมพ์ / PDF</button>
  <span class="set" id="set"></span>
</div>
<div class="sheets" id="out"></div>
<script>
/* ---------- ตัวช่วยเพิ่มเติม ป.4 ---------- */
var TH_DIG = '๐๑๒๓๔๕๖๗๘๙';
function thaiNum(s) { return String(s).replace(/[0-9]/g, function (d) { return TH_DIG[+d]; }); }
/* อ่านจำนวนนับเป็นภาษาไทย */
function thaiWords(n) {
  n = Math.floor(n);
  if (n === 0) return 'ศูนย์';
  var D = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], P = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  function six(x, whole) {
    var s = String(x), out = '', L = s.length;
    for (var i = 0; i < L; i++) {
      var d = +s[i], p = L - 1 - i;
      if (!d) continue;
      if (p === 1 && d === 1) out += 'สิบ';
      else if (p === 1 && d === 2) out += 'ยี่สิบ';
      else if (p === 0 && d === 1 && (L > 1 || whole)) out += 'เอ็ด';
      else out += D[d] + P[p];
    }
    return out;
  }
  if (n < 1000000) return six(n, false);
  var hi = Math.floor(n / 1000000), lo = n % 1000000;
  return thaiWords(hi) + 'ล้าน' + (lo ? six(lo, true) : '');
}
var PLACE = ['หน่วย', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน', 'ล้าน', 'สิบล้าน', 'ร้อยล้าน', 'พันล้าน'];

/* ตัวช่วยใบงาน (ทุกชั้น) */
function fmt(n) { return Number(n).toLocaleString('en-US'); }
function B(a, w) { return '<span class="bl' + (w ? ' ' + w : '') + '" data-a="' + String(a).replace(/"/g, '&quot;') + '"></span>'; }
function fr(n, d) { return '<span class="fr"><i>' + n + '</i><i>' + d + '</i></span>'; }
function mix(w, n, d) { return (w ? w : '') + (n ? fr(n, d) : ''); }
function gcd(a, b) { return b ? gcd(b, a % b) : a; }

function angleSVG(deg, R) {
  var rot = R.int(0, 35) * (R.int(0, 1) ? 1 : -1), W = 220, H = 150, cx = 110, cy = 120, L = 95;
  if (deg > 120) cy = 110;
  var a1 = rot * Math.PI / 180, a2 = (rot + deg) * Math.PI / 180;
  var x1 = cx + L * Math.cos(a1), y1 = cy - L * Math.sin(a1), x2 = cx + L * Math.cos(a2), y2 = cy - L * Math.sin(a2);
  var minx = Math.min(cx, x1, x2) - 10, maxx = Math.max(cx, x1, x2) + 10, miny = Math.min(cy, y1, y2) - 10, maxy = Math.max(cy, y1, y2) + 10;
  return '<svg class="ang" viewBox="' + minx.toFixed(0) + ' ' + miny.toFixed(0) + ' ' + (maxx - minx).toFixed(0) + ' ' + (maxy - miny).toFixed(0) + '"><path d="M' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' L' + cx + ',' + cy + ' L' + x2.toFixed(1) + ',' + y2.toFixed(1) + '" fill="none" stroke="#222" stroke-width="2"/><circle cx="' + cx + '" cy="' + cy + '" r="3"/></svg>';
}
function kind(d) { return d < 90 ? 'มุมแหลม' : d === 90 ? 'มุมฉาก' : d < 180 ? 'มุมป้าน' : 'มุมตรง'; }
function rectSVG(w, h, unit) {
  var sc = 120 / Math.max(w, h), W = Math.max(40, w * sc), H = Math.max(30, h * sc);
  return '<svg class="rc" viewBox="-40 -8 ' + (W + 60) + ' ' + (H + 36) + '"><rect x="0" y="0" width="' + W.toFixed(0) + '" height="' + H.toFixed(0) + '" fill="#F2FAF5" stroke="#222" stroke-width="2"/><text x="' + (W / 2).toFixed(0) + '" y="' + (H + 20).toFixed(0) + '" text-anchor="middle">' + w + ' ' + unit + '</text><text x="-6" y="' + (H / 2 + 5).toFixed(0) + '" text-anchor="end">' + h + ' ' + unit + '</text></svg>';
}

/* ใบงาน ป.3 — 13 บท ตามหนังสือเรียน สสวท. */
var CH = {};
function clockSVG(h, m) {
  var g = '<svg class="clk" viewBox="0 0 120 120"><circle cx="60" cy="60" r="55" fill="#FFFDF5" stroke="#222" stroke-width="3"/>';
  for (var i = 0; i < 60; i++) {
    var a = i * 6 * Math.PI / 180, r1 = i % 5 ? 50 : 46;
    g += '<line x1="' + (60 + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (60 - r1 * Math.cos(a)).toFixed(1) + '" x2="' + (60 + 53 * Math.sin(a)).toFixed(1) + '" y2="' + (60 - 53 * Math.cos(a)).toFixed(1) + '" stroke="#222" stroke-width="' + (i % 5 ? 0.8 : 2) + '"/>';
  }
  for (i = 1; i <= 12; i++) { a = i * 30 * Math.PI / 180; g += '<text x="' + (60 + 37 * Math.sin(a)).toFixed(1) + '" y="' + (64.5 - 37 * Math.cos(a)).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700">' + i + '</text>'; }
  var ha = ((h % 12) * 30 + m / 2) * Math.PI / 180, ma = m * 6 * Math.PI / 180;
  g += '<line x1="60" y1="60" x2="' + (60 + 26 * Math.sin(ha)).toFixed(1) + '" y2="' + (60 - 26 * Math.cos(ha)).toFixed(1) + '" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>';
  g += '<line x1="60" y1="60" x2="' + (60 + 42 * Math.sin(ma)).toFixed(1) + '" y2="' + (60 - 42 * Math.cos(ma)).toFixed(1) + '" stroke="#1F5FCC" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="60" r="3.5"/></svg>';
  return g;
}
function barSVG(d, n) { /* แถบแบ่ง d ส่วน ระบาย n ส่วน */
  var w = 180 / d, g = '<svg class="fbar" viewBox="0 0 184 34">';
  for (var i = 0; i < d; i++) g += '<rect x="' + (2 + i * w).toFixed(1) + '" y="2" width="' + w.toFixed(1) + '" height="30" fill="' + (i < n ? '#FFB020' : '#fff') + '" stroke="#222" stroke-width="1.6"/>';
  return g + '</svg>';
}
function pieSVG(d, n) {
  var g = '<svg class="fpie" viewBox="0 0 80 80">';
  for (var i = 0; i < d; i++) {
    var a1 = i / d * 2 * Math.PI, a2 = (i + 1) / d * 2 * Math.PI;
    g += '<path d="M40,40 L' + (40 + 36 * Math.sin(a1)).toFixed(1) + ',' + (40 - 36 * Math.cos(a1)).toFixed(1) + ' A36,36 0 ' + (a2 - a1 > Math.PI ? 1 : 0) + ',1 ' + (40 + 36 * Math.sin(a2)).toFixed(1) + ',' + (40 - 36 * Math.cos(a2)).toFixed(1) + ' Z" fill="' + (i < n ? '#5BC0EB' : '#fff') + '" stroke="#222" stroke-width="1.4"/>';
  }
  return g + '</svg>';
}
function th2(x) { return ('0' + x).slice(-2); }
function tt3(x) { return Math.floor(x / 60) + '.' + th2(x % 60) + ' น.'; }
function du3(x) { var o = ''; if (x >= 60) o += Math.floor(x / 60) + ' ชั่วโมง '; if (x % 60) o += (x % 60) + ' นาที'; return o.trim(); }
function baht(st) { return (Math.floor(st / 100)) + '.' + th2(st % 100); }

CH[1] = { t: 'จำนวนนับไม่เกิน 100,000', e: '🔢', make: function (R) {
  var s = [], a = [], i, n;
  for (i = 0; i < 4; i++) { n = R.int(10001, 99999); a.push('<b>' + fmt(n) + '</b> อ่านว่า ' + B(thaiWords(n), 'long')); }
  s.push({ h: 'เขียนตัวเลขเป็นตัวหนังสือ', items: a, cols: 1 });
  a = []; for (i = 0; i < 4; i++) { n = R.int(1001, 99999); a.push(thaiWords(n) + '<br>ตัวเลขฮินดูอารบิก ' + B(fmt(n), 'mid') + ' ตัวเลขไทย ' + B(thaiNum(fmt(n)), 'mid')); }
  s.push({ h: 'เขียนเป็นตัวเลขฮินดูอารบิกและตัวเลขไทย', items: a, cols: 1 });
  a = []; for (i = 0; i < 4; i++) {
    n = R.int(10000, 99999); var str = String(n), p = R.int(0, 4); while (str[4 - p] === '0') p = R.int(0, 4);
    var shown = fmt(n), cnt = 0, out = '';
    for (var j = shown.length - 1; j >= 0; j--) { var ch = shown[j]; if (ch === ',') { out = ch + out; continue; } out = (cnt === p ? '<u>' + ch + '</u>' : ch) + out; cnt++; }
    a.push('เลขโดดที่ขีดเส้นใต้ใน <b>' + out + '</b> อยู่ในหลัก' + B(PLACE[p], 'sm') + ' มีค่า ' + B(fmt(+str[4 - p] * Math.pow(10, p)), 'sm'));
  }
  s.push({ h: 'หลักและค่าของเลขโดด', items: a, cols: 1 });
  a = []; for (i = 0; i < 2; i++) {
    var ds = []; for (var k = 0; k < 5; k++) ds.push(k === 0 ? R.int(1, 9) : (R.int(0, 3) ? R.int(1, 9) : 0));
    n = +ds.join(''); var parts = ds.map(function (x, j) { return x * Math.pow(10, 4 - j); }).filter(Boolean).map(fmt);
    a.push('<b>' + fmt(n) + '</b> = ' + B(parts.join(' + '), 'long'));
  }
  s.push({ h: 'เขียนในรูปกระจาย', items: a, cols: 1 });
  a = []; for (i = 0; i < 6; i++) {
    var x = R.int(10000, 99999), y = R.pick([x + R.int(1, 90) * Math.pow(10, R.int(0, 3)), x - R.int(1, 9) * Math.pow(10, R.int(0, 3)), x]);
    if (y > 99999) y = x - 1;
    a.push(fmt(x) + ' ' + B(x > y ? '>' : x < y ? '<' : '=', 'sm') + ' ' + fmt(y));
  }
  s.push({ h: 'เติมเครื่องหมาย >, < หรือ =', items: a, cols: 3 });
  var L = []; while (L.length < 4) { var v = R.int(30, 39) * 1000 + R.int(0, 999); if (L.indexOf(v) < 0) L.push(v); }
  var srt = L.slice().sort(function (p, q) { return p - q; });
  s.push({ h: 'เรียงลำดับจากน้อยไปมาก', items: [L.map(fmt).join(' , ') + '<br>' + B(srt.map(fmt).join('  <  '), 'long')], cols: 1 });
  a = []; for (i = 0; i < 3; i++) {
    var st = R.int(1, 9) * Math.pow(10, R.int(1, 3)), dlt = R.pick([1, 2, 5, 10, 25, 50, 100, 500, 1000]) * (R.int(0, 1) ? 1 : -1), b0 = R.int(20, 80) * 1000;
    var sq = [0, 1, 2, 3, 4, 5].map(function (t) { return b0 + t * dlt; });
    a.push(sq.slice(0, 4).map(fmt).join(', ') + ', ' + B(fmt(sq[4]), 'sm') + ', ' + B(fmt(sq[5]), 'sm'));
  }
  s.push({ h: 'แบบรูปของจำนวน (เติมจำนวนถัดไป)', items: a, cols: 1 });
  return s;
} };

CH[2] = { t: 'การบวกและการลบจำนวนนับไม่เกิน 100,000', e: '➕', make: function (R) {
  var s = [], a = [], i, x, y;
  for (i = 0; i < 4; i++) { x = R.int(1000, 59999); y = R.int(1000, 99999 - x); a.push(fmt(x) + ' + ' + fmt(y) + ' = ' + B(fmt(x + y))); }
  for (i = 0; i < 4; i++) { x = R.int(10000, 99999); y = R.int(1000, x - 1); a.push(fmt(x) + ' − ' + fmt(y) + ' = ' + B(fmt(x - y))); }
  s.push({ h: 'หาผลบวกและผลลบ (ตั้งหาคำตอบในที่ว่าง)', items: a, cols: 2, work: true });
  a = [];
  x = R.int(1000, 40000); y = R.int(1000, 40000); a.push('□ + ' + fmt(y) + ' = ' + fmt(x + y) + ' &nbsp; □ = ' + B(fmt(x)));
  x = R.int(1000, 40000); y = R.int(1000, 40000); a.push(fmt(x) + ' + □ = ' + fmt(x + y) + ' &nbsp; □ = ' + B(fmt(y)));
  x = R.int(20000, 90000); y = R.int(1000, x - 1); a.push(fmt(x) + ' − □ = ' + fmt(x - y) + ' &nbsp; □ = ' + B(fmt(y)));
  x = R.int(1000, 50000); y = R.int(1000, 40000); a.push('□ − ' + fmt(y) + ' = ' + fmt(x) + ' &nbsp; □ = ' + B(fmt(x + y)));
  s.push({ h: 'หาค่าของตัวไม่ทราบค่า □', items: a, cols: 2 });
  a = [];
  var b1 = R.int(10, 40) * 100 + R.int(0, 99), b2 = R.int(10, 40) * 100 + R.int(0, 99);

function unitCh(R, U) { /* ใช้ร่วมกันสำหรับ ความยาว / น้ำหนัก / ปริมาตร */
  var s = [], a = [], i, x, y;
  U.conv.forEach(function (c) {
    var b = R.int(2, 9), sm = R.int(1, c[2] - 1); if (c[2] >= 100) sm = R.int(1, 19) * (c[2] >= 1000 ? 50 : 5);
    a.push(b + ' ' + c[0] + ' ' + sm + ' ' + c[1] + ' = ' + B(fmt(b * c[2] + sm), 'sm') + ' ' + c[1]);
    var t = R.int(2, 9) * c[2] + (c[2] >= 1000 ? R.int(1, 19) * 50 : c[2] >= 100 ? R.int(1, 19) * 5 : R.int(1, c[2] - 1));
    a.push(fmt(t) + ' ' + c[1] + ' = ' + B(Math.floor(t / c[2]), 'sm') + ' ' + c[0] + ' ' + B(t % c[2], 'sm') + ' ' + c[1]);
  });
  s.push({ h: 'เปลี่ยนหน่วย', items: a, cols: 1 });
  a = [];
  U.est.forEach(function (e) { a.push(e[0] + ' ' + B(e[1], 'sm')); });
  s.push({ h: U.estH, items: R.shuffle(a).slice(0, 4), cols: 2 });
  a = []; var c0 = U.conv[0];
  for (i = 0; i < 4; i++) {
    var b1 = R.int(1, 9), s1 = R.int(1, c0[2] - 1), b2 = R.int(1, 9), s2 = R.int(1, c0[2] - 1);
    if (c0[2] >= 100) { s1 = R.int(1, 19) * 50 * c0[2] / 1000; s2 = R.int(1, 19) * 50 * c0[2] / 1000; }
    var v1 = b1 * c0[2] + s1, v2 = b2 * c0[2] + s2;
    a.push(b1 + ' ' + c0[0] + ' ' + s1 + ' ' + c0[1] + ' ' + B(v1 > v2 ? '>' : v1 < v2 ? '<' : '=', 'sm') + ' ' + fmt(v2) + ' ' + c0[1]);
  }
  s.push({ h: 'เติมเครื่องหมาย >, < หรือ =', items: a, cols: 1 });
  function sh(t) { var b = Math.floor(t / c0[2]), r = t % c0[2]; return (b ? b + ' ' + c0[0] + ' ' : '') + (r ? r + ' ' + c0[1] : '').trim(); }
  var step = c0[2] >= 1000 ? 50 : c0[2] >= 100 ? 5 : 1;
  a = [];
  x = R.int(1, 5) * c0[2] + R.int(1, c0[2] / step - 1) * step; y = R.int(1, 4) * c0[2] + R.int(1, c0[2] / step - 1) * step;
  a.push(sh(x) + ' + ' + sh(y) + ' = ' + B(sh(x + y), 'mid'));
  x = R.int(5, 9) * c0[2] + R.int(1, c0[2] / step - 1) * step; y = R.int(1, 4) * c0[2] + R.int(1, c0[2] / step - 1) * step;
  a.push(sh(x) + ' − ' + sh(y) + ' = ' + B(sh(x - y), 'mid'));
  var k = R.int(2, 5); x = R.int(1, 3) * c0[2] + R.int(1, c0[2] / step / 2) * step;
  a.push(sh(x) + ' × ' + k + ' = ' + B(sh(x * k), 'mid'));
  k = R.int(2, 5); x = (R.int(1, 3) * c0[2] + R.int(1, c0[2] / step / 2) * step);
  a.push(sh(x * k) + ' ÷ ' + k + ' = ' + B(sh(x), 'mid'));
  s.push({ h: 'บวก ลบ คูณ หาร (ตอบเป็นหน่วยผสม)', items: a, cols: 1, work: true });
  s.push({ h: 'โจทย์ปัญหา', items: U.word(R, sh, c0, step), cols: 1, work: true });
  return s;
}

  function parse() {
    var m = location.hash.match(/ch(\d+)(?:-(\d+))?/);
    if (m && CH[m[1]]) { state.ch = m[1]; state.seed = +(m[2] || 0) || Math.floor(Math.random() * 9000) + 1000; }
    else state.ch = '';
  }
  function draw() {
    sel.value = state.ch;
    document.getElementById('set').textContent = state.ch ? 'ชุดที่ ' + state.seed : '';
    ['nw', 'ky', 'pr'].forEach(function (id) { document.getElementById(id).disabled = !state.ch; });
    if (!state.ch) {
      out.innerHTML = '<div class="list">' + keys.map(function (k) { return '<a href="#ch' + k + '"><span>' + CH[k].e + '</span>บทที่ ' + k + '<br>' + CH[k].t + '</a>'; }).join('') + '</div>';
      return;
    }
    var C = CH[state.ch], secs = C.make(mk(state.seed * 131 + (+state.ch)));
    var head = '<div class="hd"><div><h1>' + C.e + ' ใบงาน บทที่ ' + state.ch + ' ' + C.t + '</h1><div class="sub">คณิตศาสตร์ ป.3 · สไตล์ครูอู๋ · ชุดที่ ' + state.seed + '</div></div><img src="k10.webp" alt=""><div class="who"><span>ชื่อ<i></i></span><span>ชั้น<i class="s"></i></span><span>เลขที่<i class="s"></i></span><span class="score">คะแนน ____ / ' + secs.reduce(function (p, s) { return p + (s.info || (s.fig && s.items.length === 1) ? 0 : s.items.length); }, 0) + '</span></div></div>';
    var pages = [[]], n = 0;
    secs.forEach(function (s, i) {
      var html = '<div class="sec"><h2><span class="n">' + (i + 1) + '</span>' + s.h + '</h2><ol class="items c' + (s.cols || 1) + (s.work ? ' work' : '') + '">' + s.items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol></div>';
      var w = s.items.length * (s.work ? 3 : 1.4) / (s.cols || 1) + (s.fig ? 6 : 1.5);
      if (n + w > 30 && pages[pages.length - 1].length) { pages.push([]); n = 0; }
      pages[pages.length - 1].push(html); n += w;
    });
    out.className = 'sheets' + (state.key ? ' key' : '');
    out.innerHTML = pages.map(function (p, i) {
      return '<section class="page"><span class="keytag">เฉลย</span>' + (i === 0 ? head : '') + p.join('') + '<div class="foot"><span>ครูอู๋ ธนศักดิ์ แก้วถาวร · ห้องเรียนแสนสนุก KruAu</span><span>บทที่ ' + state.ch + ' · ชุดที่ ' + state.seed + ' · หน้า ' + (i + 1) + '/' + pages.length + '</span></div></section>';
    }).join('');
  }
  function go(ch, seed) { location.hash = ch ? 'ch' + ch + '-' + seed : ''; }
  sel.onchange = function () { state.key = false; document.getElementById('ky').classList.remove('on'); go(sel.value, Math.floor(Math.random() * 9000) + 1000); };
  document.getElementById('nw').onclick = function () { go(state.ch, Math.floor(Math.random() * 9000) + 1000); };
  document.getElementById('ky').onclick = function () { state.key = !state.key; this.classList.toggle('on', state.key); this.textContent = state.key ? '🔑 ซ่อนเฉลย' : '🔑 เฉลย (ครู)'; draw(); };
  document.getElementById('pr').onclick = function () { try { window.print(); } catch (e) {} };
  window.addEventListener('hashchange', function () { parse(); draw(); });
  parse();
  if (state.ch && !/-\d+/.test(location.hash)) history.replaceState(null, '', '#ch' + state.ch + '-' + state.seed);
  draw();
})();
</script>
</body>
</html>
