<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เอาชีวิตรอดยุคโบราณ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
.camp{width:100%;background:linear-gradient(#FFE7B8,#F9D58C);border-radius:20px;padding:10px 14px;box-shadow:0 6px 0 #E0B865;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.camp .pop{font-weight:700;white-space:nowrap}
.camp .vil{flex:1;min-height:42px;font-size:1.7rem;letter-spacing:2px;line-height:1.2}
.camp .vil span{display:inline-block;animation:pop .45s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}}
.story{width:100%;margin-top:12px;background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--line);text-align:center}
.story .e{font-size:2.6rem;line-height:1.1}
.story .t{font-weight:700;font-size:clamp(1.05rem,3.4vw,1.32rem);line-height:1.45;margin-top:4px}
.tiles{display:grid;gap:12px;margin-top:14px;width:100%}
.tile{border:none;border-radius:18px;padding:14px 10px;font-weight:700;font-size:clamp(.95rem,3vw,1.12rem);line-height:1.4;color:#24304A;box-shadow:0 6px 0 rgba(0,0,0,.15);background:var(--tc);text-align:left;display:flex;gap:10px;align-items:center}
.tile .e{font-size:2rem;flex:none}
.tile:active{transform:translateY(3px)}
.tile.no{animation:shake .4s;opacity:.45}
.tile.ok{outline:5px solid #2FA866}

</style>
</head>
<body>
<script src="kit.js"></script>
<script>
(function(){
const {shuffle} = KIT;
const N = 8;
const TC = ["#CFEFD9","#D8E8FF","#FFE3C9","#F3DDF7"];
/* [icon, story, [best icon, text], wrongs [[icon,text]...], why] */
const B1 = [
  ["🗺️","เผ่าของเราจะตั้งถิ่นฐานที่ไหนดี?",["🏞️","ที่ราบใกล้แม่น้ำ"],[["⛰️","ยอดเขาสูงชัน"],["🏜️","ที่แห้งแล้งไม่มีน้ำ"],["🌑","ป่าทึบไกลแหล่งน้ำ"]],"ที่ราบใกล้แม่น้ำมีน้ำใช้ ดินดี เหมาะเพาะปลูก"],
  ["💧","ทำไมคนโบราณชอบอยู่ใกล้แหล่งน้ำ?",["🐟","มีน้ำดื่ม ใช้เพาะปลูก และจับปลาได้"],[["🌊","เพราะชอบว่ายน้ำเล่น"],["❄️","เพราะอากาศหนาว"],["🎣","เพราะไม่ต้องทำงาน"]],"น้ำเป็นปัจจัยสำคัญต่อการดำรงชีวิต"],
  ["🌱","ดินแบบไหนเหมาะกับการเพาะปลูก?",["🟫","ดินอุดมสมบูรณ์บริเวณที่ราบลุ่ม"],[["🪨","ดินหินแข็งบนภูเขา"],["🏖️","ทรายแห้งริมทะเลทราย"],["🧊","ดินที่แข็งเป็นน้ำแข็ง"]],"ที่ราบลุ่มแม่น้ำมีดินตะกอนอุดมสมบูรณ์"],
  ["🛖","คนยุคหินเก่าอาศัยอยู่ที่ไหน?",["🕳️","ในถ้ำและเพิงผา"],[["🏠","บ้านไม้ยกพื้นหลังใหญ่"],["🏙️","ตึกในเมือง"],["⛺","บ้านอิฐในหมู่บ้าน"]],"ยุคหินเก่ายังเร่ร่อน อาศัยถ้ำและเพิงผา"],
  ["🍖","คนยุคหินเก่าหาอาหารอย่างไร?",["🏹","ล่าสัตว์และเก็บของป่า"],[["🌾","ปลูกข้าวในนา"],["🛒","ซื้อที่ตลาด"],["🐄","เลี้ยงวัวในฟาร์ม"]],"ยุคหินเก่ายังไม่รู้จักเพาะปลูก"],
  ["🔥","อะไรช่วยให้คนโบราณปลอดภัยและทำอาหารสุกได้?",["🔥","การรู้จักใช้ไฟ"],[["💡","หลอดไฟฟ้า"],["📱","โทรศัพท์"],["🧊","ตู้เย็น"]],"ไฟใช้ให้แสงสว่าง ความอบอุ่น และไล่สัตว์ร้าย"],
  ["🐟","ชุมชนริมทะเลมีอาชีพอะไรได้ดี?",["🎣","ทำประมงและค้าขายทางเรือ"],[["⛏️","ขุดหิมะ"],["🐪","เลี้ยงอูฐในทะเลทราย"],["🌲","ตัดไม้บนยอดเขา"]],"ทะเลเป็นแหล่งอาหารและเส้นทางค้าขาย"]
];
const B2 = [
  ["🪓","ยุคหินใหม่ อยากตัดไม้มาสร้างบ้าน ใช้เครื่องมืออะไร?",["🪓","ขวานหินขัด"],[["🔪","มีดเหล็ก"],["🪚","เลื่อยไฟฟ้า"],["🔧","ประแจเหล็ก"]],"ยุคหินใหม่ใช้เครื่องมือหินขัดผิวเรียบ"],
  ["🌾","เผ่าเริ่มปลูกข้าวได้ จะเก็บข้าวไว้ในอะไร?",["🏺","ภาชนะดินเผา"],[["🥫","กระป๋องเหล็ก"],["🛍️","ถุงพลาสติก"],["🧊","กล่องโฟม"]],"ยุคหินใหม่รู้จักทำภาชนะดินเผา"],
  ["🛖","ทำไมคนยุคหินใหม่จึงตั้งบ้านเรือนถาวร?",["🌾","เพราะเพาะปลูกได้ ต้องอยู่ดูแลพืชผล"],[["🚗","เพราะมีรถยนต์"],["🦖","เพราะหนีไดโนเสาร์"],["❄️","เพราะหิมะตกทุกวัน"]],"การเพาะปลูกทำให้คนอยู่เป็นหลักแหล่ง"],
  ["🔔","ยุคโลหะ เผ่าของเราหล่อเครื่องมือจากอะไร?",["🟤","สำริด (ทองแดงผสมดีบุก)"],[["🧱","ดินเหนียวอย่างเดียว"],["🪵","ไม้ไผ่"],["🧴","พลาสติก"]],"ยุคสำริดใช้ทองแดงผสมดีบุก"],
  ["⛏️","พบแหล่งแร่ทองแดงและดีบุกใกล้หมู่บ้าน จะได้ประโยชน์อะไร?",["🔨","นำมาทำเครื่องมือเครื่องใช้โลหะ"],[["🍚","นำมาหุงเป็นอาหาร"],["👕","นำมาทอเป็นผ้า"],["💧","นำมาใช้แทนน้ำดื่ม"]],"ทรัพยากรแร่ทำให้ชุมชนพัฒนาสู่ยุคโลหะ"],
  ["🐃","เลี้ยงสัตว์ไว้ทำอะไร?",["🐃","เป็นอาหารและใช้แรงงาน"],[["🎪","เอาไว้แสดงละครสัตว์"],["🏎️","ใช้แข่งรถ"],["📺","ใช้ดูเล่น"]],"ยุคหินใหม่เลี้ยงสัตว์ไว้เป็นอาหารและช่วยทำงาน"],
  ["🧭","ปัจจัยใดทำให้มนุษย์เลือกตั้งถิ่นฐาน?",["🏞️","ทำเลที่ตั้งดี และทรัพยากรธรรมชาติอุดมสมบูรณ์"],[["🎮","มีร้านเกมใกล้บ้าน"],["⛰️","อยู่บนยอดเขาสูงที่สุด"],["🏜️","ไม่มีใครอยู่เลย"]],"ทำเลดีและทรัพยากรอุดมสมบูรณ์ช่วยให้ดำรงชีวิตได้"],
  ["⚓","ชุมชนชายฝั่งเริ่มค้าขายกับต่างแดน ได้รับอะไรมา?",["🙏","ศาสนาและวัฒนธรรมจากอินเดีย"],[["🍔","อาหารฟาสต์ฟู้ด"],["📱","สมาร์ตโฟน"],["🚀","จรวด"]],"การติดต่อค้าขายทำให้รับวัฒนธรรมอินเดีย เช่น ศาสนา ตัวอักษร"]
];
const B3 = [
  ["🏺","แหล่งโบราณคดีบ้านเชียง จ.อุดรธานี พบหลักฐานอะไรเด่น?",["🏺","ภาชนะดินเผาลายเขียนสีแดง และเครื่องสำริด"],[["🗿","ศิลาจารึกพ่อขุนรามคำแหง"],["🛕","พระปรางค์สามยอด"],["📖","พงศาวดารอยุธยา"]],"บ้านเชียงเป็นแหล่งยุคโลหะที่สำคัญ"],
  ["🎨","ภาพเขียนสีบนผาหินริมแม่น้ำโขง จ.อุบลราชธานี คือที่ใด?",["🎨","ผาแต้ม"],[["🏛️","บ้านเก่า"],["🛕","วัดมหาธาตุ"],["🗿","เมืองโบราณอู่ทอง"]],"ภาพเขียนสีผาแต้มเป็นหลักฐานสมัยก่อนประวัติศาสตร์"],
  ["🖌️","ภาพเขียนสีเขาจันทน์งาม อยู่จังหวัดใด?",["📍","นครราชสีมา"],[["📍","อุบลราชธานี"],["📍","เชียงใหม่"],["📍","ภูเก็ต"]],"เขาจันทน์งาม อำเภอสีคิ้ว จังหวัดนครราชสีมา"],
  ["💀","แหล่งโบราณคดีบ้านเก่า อยู่จังหวัดใด?",["📍","กาญจนบุรี"],[["📍","อุดรธานี"],["📍","ลำพูน"],["📍","นครศรีธรรมราช"]],"บ้านเก่า จังหวัดกาญจนบุรี พบโครงกระดูกและภาชนะดินเผาสมัยก่อนประวัติศาสตร์"],
  ["🕳️","ถ้ำผีและถ้ำลอด จ.แม่ฮ่องสอน เป็นหลักฐานของอะไร?",["🕳️","การอาศัยในถ้ำและเพิงผาของคนยุคหิน"],[["🏯","พระราชวังของกษัตริย์"],["⚓","ท่าเรือค้าขาย"],["🏫","โรงเรียนโบราณ"]],"คนยุคหินอาศัยตามถ้ำและเพิงผา"],
  ["🏘️","เพราะเหตุใดชุมชนเล็ก ๆ จึงพัฒนาเป็นเมืองและแคว้น?",["📈","ประชากรเพิ่มขึ้น มีการค้าขายและรับวัฒนธรรมจากภายนอก"],[["🌧️","เพราะฝนตกทุกวัน"],["🦖","เพราะสัตว์ป่าหายไปหมด"],["😴","เพราะคนไม่อยากทำงาน"]],"การค้าและวัฒนธรรมทำให้ชุมชนขยายเป็นเมือง"],
  ["📜","การเข้าสู่สมัยประวัติศาสตร์ของดินแดนไทยใช้อะไรเป็นเกณฑ์?",["✍️","การพบตัวอักษรที่ใช้บันทึกเรื่องราว"],[["🔔","การพบเครื่องมือสำริด"],["🌾","การเริ่มปลูกข้าว"],["🔥","การรู้จักใช้ไฟ"]],"สมัยประวัติศาสตร์เริ่มเมื่อมีการบันทึกด้วยตัวอักษร"],
  ["🌏","ทำไมแต่ละดินแดนเข้าสู่สมัยประวัติศาสตร์ไม่พร้อมกัน?",["⏳","เพราะแต่ละที่เริ่มใช้ตัวอักษรในเวลาต่างกัน"],[["🌙","เพราะดวงจันทร์ต่างกัน"],["🎂","เพราะวันเกิดคนต่างกัน"],["🗺️","เพราะแผนที่ต่างกัน"]],"แต่ละสังคมรู้จักใช้ตัวอักษรไม่พร้อมกัน"]
];
const BANK = {1:B1, 2:B2, 3:B3};
const HUTS = ["🛖","🔥","🛖","🐖","🌾","🛖","🏺","🛖","🐃","🌳"];

KIT.mount({
  key:"h4-survive", title:"เอาชีวิตรอดยุคโบราณ", subtitle:"ประวัติศาสตร์ ป.4 · หน่วยที่ 2 การตั้งถิ่นฐานและพัฒนาการของมนุษย์",
  heroHTML:"พาเผ่า<em>เอาชีวิตรอด</em> และสร้างหมู่บ้าน 🛖", heroDesc:"เป็นหัวหน้าเผ่าโบราณ เลือกให้ถูกว่าจะตั้งถิ่นฐานที่ไหน หาอาหารอย่างไร ใช้เครื่องมืออะไร หมู่บ้านจะเติบโตขึ้นเรื่อย ๆ",
  progIcon:"🛖",
  howto:["อ่านสถานการณ์ของเผ่า","แตะทางเลือกที่ทำให้เผ่าอยู่รอด","เลือกถูก หมู่บ้านโตขึ้น เลือกผิดเสีย 10 คะแนน","ผ่าน 8 สถานการณ์ หมู่บ้านสมบูรณ์"],
  levels:{
    1:{pill:"8 สถานการณ์", color:"var(--green)", desc:"ตั้งถิ่นฐานที่ไหน หาอาหารอย่างไร (ยุคหินเก่า)"},
    2:{pill:"8 สถานการณ์", color:"var(--blue)", desc:"ยุคหินใหม่–ยุคโลหะ เครื่องมือ การเพาะปลูก การค้า"},
    3:{pill:"8 สถานการณ์", color:"var(--purple)", desc:"แหล่งโบราณคดีในไทย และพัฒนาการสู่สมัยประวัติศาสตร์"}
  },
  play(level, ctx){
    const deck = shuffle(BANK[level].slice()).slice(0, N);
    ctx.stage.innerHTML = `<div class="camp"><span class="pop" id="pp">👥 ชาวเผ่า 5 คน</span><span class="vil" id="vl"></span></div>
      <div class="story"><div class="qlabel" id="qn"></div><div class="e" id="ic"></div><div class="t" id="tx"></div></div><div class="tiles" id="tl"></div>`;
    const $ = s => ctx.stage.querySelector(s);
    let idx = 0, first = true, lock = false, people = 5;
    function next(){
      if (idx >= N){ ctx.finish({targetSec: 110}); return; }
      const [ic, tx, best, wr] = deck[idx]; first = true; lock = false;
      $("#qn").textContent = `สถานการณ์ ${idx+1} จาก ${N}`; $("#ic").textContent = ic; $("#tx").textContent = tx;
      const opts = shuffle([best, ...shuffle(wr.slice()).slice(0, level === 1 ? 2 : 3)]);
      $("#tl").style.gridTemplateColumns = opts.length === 4 ? "1fr 1fr" : "1fr";
      $("#tl").innerHTML = opts.map((o,i)=>`<button class="tile" type="button" data-ok="${o===best?1:0}" style="--tc:${TC[i]}"><span class="e">${o[0]}</span>${o[1]}</button>`).join("");
    }
    $("#tl").addEventListener("click", e => {
      const b = e.target.closest(".tile"); if (!b || lock || b.classList.contains("no")) return;
      const it = deck[idx];
      if (b.dataset.ok === "1"){
        lock = true; b.classList.add("ok"); people += first ? 6 : 3;
        $("#pp").textContent = `👥 ชาวเผ่า ${people} คน`;
        const h = document.createElement("span"); h.textContent = HUTS[idx % HUTS.length]; $("#vl").appendChild(h);
        ctx.correct(first ? 100 : 50, `เผ่าอยู่รอด! ${it[4]}`); idx++; ctx.progress(idx, N); ctx.after(1500, next);
      } else { first = false; b.classList.add("no"); ctx.wrong("ทางนี้เผ่าลำบากแน่ ลองเลือกใหม่"); }
    });
    ctx.progress(0, N); ctx.say("หัวหน้าเผ่า พร้อมนำทางหรือยัง?");
    next();
  }
});

})();
</script>
</body>
</html>
