<style>
.badges{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}
.bdg{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;border-radius:16px;background:#fff;border:3px dashed var(--line);color:#C9B8A8;transition:transform .3s}
.bdg b{font-size:1.5rem;line-height:1.1}
.bdg small{font-size:.72rem;font-weight:700;white-space:nowrap}
.bdg.on{background:var(--c);border:3px solid #fff;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);animation:earn .6s}
.bdg.half{border:3px solid var(--c);color:var(--ink-soft)}
.scene{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"pic clock" "pic story";gap:4px 16px;align-items:center;background:linear-gradient(110deg,#FFF6E8,#F3EEFF);border-radius:24px;padding:16px 18px;border:3px solid #fff;box-shadow:0 5px 0 rgba(183,164,238,.3)}
.scene .pic{grid-area:pic;font-size:3.4rem;width:86px;height:86px;display:grid;place-items:center;background:#fff;border-radius:50%;box-shadow:0 4px 0 var(--line)}
.scene .clock{grid-area:clock;font-weight:700;color:var(--ink-soft);font-size:.9rem}
.scene .story{grid-area:story;font-size:1.12rem;line-height:1.55}
.choice{text-align:left}
@keyframes earn{0%{transform:scale(.6) rotate(-15deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:none}}
@media (max-width:520px){.bdg b{font-size:1.15rem}.bdg small{font-size:.58rem}.scene{grid-template-columns:1fr;grid-template-areas:"clock" "pic" "story";text-align:center}.scene .pic{margin:0 auto;width:70px;height:70px;font-size:2.6rem}}

</style>
</head>

    const total = scenes.length, earned = {};

      if (idx >= total){ ctx.finish({targetSec: level === 3 ? 260 : 170}); return; }
      const [L, ic, time, story, good, b1, b2, why] = scenes[idx];
      const opts = shuffle([good, b1, b2]);
      ctx.stage.innerHTML = `${badges()}<div class="scene"><div class="clock">🕒 ${time}</div><div class="pic">${ic}</div><div class="story"><b>น้องกล้า:</b> ${story}</div></div><div id="q"></div>`;
      KIT.mcq(ctx, ctx.stage.querySelector("#q"), {label:`เหตุการณ์ที่ ${idx+1} จาก ${total}`, html:"ถ้าเป็นเธอ จะเลือกทำอย่างไร", options:opts, answer:opts.indexOf(good), cols:1, explain:why,
        onNext: ok => {
          if (level === 1){ earned[L] = ok ? 1 : (earned[L] || 0); idx++; ctx.progress(idx, total); next(); return; }
          letterQ(L, ok, why);
        }});
    }
    function letterQ(L, okChoice, why){
      const opts = ORDER.map(k => level === 2 ? `${k} · ${LETTERS[k][1]}` : k);
      ctx.stage.innerHTML = `${badges()}<div id="q"></div>`;
      KIT.mcq(ctx, ctx.stage.querySelector("#q"), {label:"ตราฮีโร่", html:"การกระทำที่ถูกต้องเมื่อกี้ ตรงกับตัวอักษรใดของ <b>STRONG</b>", options:opts, answer:ORDER.indexOf(L), cols:3, explain:why,
        onNext: ok => { earned[L] = ok && okChoice ? 1 : Math.max(earned[L] || 0, 0); idx++; ctx.progress(idx, total); next(); }});
    }
    ctx.progress(0, total); ctx.say("เช้าวันใหม่ของน้องกล้าเริ่มขึ้นแล้ว!");
    next();
  }
});

})();
</script>
</body>
</html>
