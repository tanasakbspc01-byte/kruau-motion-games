<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ห้องแล็บทำสไลม์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
.lab{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:10px;background:linear-gradient(#F3F0FF,#E6FFF4);border-radius:24px;border:4px solid #fff;box-shadow:0 6px 0 rgba(155,231,196,.35);padding:12px}
.cyl{width:min(180px,46vw)}
.sl{font-size:3rem;animation:wob 1.6s ease-in-out infinite}
.big{display:inline-block;font-size:1.9rem;font-weight:700;color:var(--orange-deep)}
.choices .choice{font-size:clamp(1.15rem,4.8vw,1.7rem)}
@keyframes wob{50%{transform:scale(1.08,.92)}}

</style>
</head>
<body>
<script src="kit.js"></script>
<script>
(function(){
const {rand, pick, shuffle, fmt} = KIT;
const N = 8;
const COL = ["#9BE7C4","#F7A8D0","#B7A4EE","#86D9F0","#F6CD6B"];
function cyl(v, max, maj, min, col){
  const H = 220, top = 16, y = x => top + H - x / max * H;
  let t = ""; const steps = Math.round(max / min), per = Math.round(maj / min);
  for (let i = 0; i <= steps; i++){ const x = i * min, M = i % per === 0; t += `<line x1="${M ? 96 : 104}" x2="118" y1="${y(x)}" y2="${y(x)}" stroke="#2E5E8A" stroke-width="${M ? 2.4 : 1.2}"/>${M ? `<text x="90" y="${y(x) + 5}" text-anchor="end" font-size="13" font-weight="700" fill="#2E5E8A">${fmt(x)}</text>` : ""}`; }
  return `<svg viewBox="0 0 170 260" class="cyl"><rect x="96" y="${top - 6}" width="56" height="${H + 10}" rx="8" fill="#F4FBFF" stroke="#9CC8E8" stroke-width="3"/>
    <rect x="99" y="${y(v)}" width="50" height="${H - (y(v) - top)}" rx="4" fill="${col}"/><path d="M99 ${y(v)} q25 6 50 0" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>${t}<text x="124" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#2E5E8A">มิลลิลิตร</text></svg>`;
}
const PLAN = {1:["read","conv","read","unit","sum","read","conv","unit"], 2:["read","conv2","sum","read","diff","conv","unit","compare"], 3:["read","conv2","diff","recipe","compare","sum","recipe","conv2"]};

KIT.mount({
  key:"g3-slime", title:"ห้องแล็บทำสไลม์", subtitle:"คณิตศาสตร์ ป.3 · บทที่ 11 การวัดปริมาตร",
  heroHTML:"ตวงส่วนผสม<em>สไลม์</em>ให้เป๊ะ 🧪", heroDesc:"ห้องแล็บสไลม์สุดฮิต! อ่านขีดบนกระบอกตวงเป็นมิลลิลิตร แปลงลิตรเป็นมิลลิลิตร และคำนวณส่วนผสมให้ได้สไลม์ยืดหยุ่นพอดี",
  progIcon:"🧪",
  howto:["อ่านระดับของเหลวตรงผิวบนในกระบอกตวง","ดูว่าตัวเลขห่างกันเท่าไร และขีดเล็ก 1 ขีดมีค่าเท่าไร","1 ลิตร = 1,000 มิลลิลิตร","กด 🔊 ฟังโจทย์ได้"],
  note:"ลิตร (ล.) ใช้ตวงปริมาณมาก มิลลิลิตร (มล.) ใช้ตวงปริมาณน้อย · 2 ล. 300 มล. = 2,300 มล.",
  levels:{
    1:{pill:N+" สูตร", color:"var(--green)", desc:"อ่านกระบอกตวง (ขีดละ 10 มล.) แปลง ล.–มล."},
    2:{pill:N+" สูตร", color:"var(--blue)", desc:"ขีดละ 50 มล. บวกลบปริมาตร เปรียบเทียบ"},
    3:{pill:N+" สูตร", color:"var(--purple)", desc:"โจทย์สูตรสไลม์ ปริมาตรหลายหน่วย"}
  },
  play(level, ctx){
    let idx = 0;
    const done = () => { idx++; ctx.progress(idx, N); next(); };
    function next(){
      if (idx >= N){ ctx.finish({targetSec: 200}); return; }
      const kind = PLAN[level][idx], c = COL[idx % COL.length];
      let pre = "", html, say, opts, ans, explain, cols = 3;
      const near = (v, st, u) => { const s = new Set([v]); for (const d of shuffle([st, -st, 2*st])) if (s.size < 3 && v + d > 0) s.add(v + d); const o = shuffle([...s]); opts = o.map(x => `${fmt(x)} ${u}`); ans = o.indexOf(v); };
      if (kind === "read"){ const cfg = level === 1 ? [100, 20, 10] : level === 2 ? [500, 100, 50] : [1000, 200, 50], v = rand(1, cfg[0] / cfg[2] - 1) * cfg[2];
        pre = `<div class="lab">${cyl(v, ...cfg, c)}<div class="sl">🫙</div></div>`; html = "ในกระบอกตวงมีน้ำยากี่มิลลิลิตร"; say = html; near(v, cfg[2], "มล."); explain = `ขีดเล็ก 1 ขีด = ${cfg[2]} มล. ผิวน้ำยาตรงกับ ${fmt(v)} มล.`; }
      else if (kind === "conv"){ const l = rand(1, 9); html = `<span class="big">${l} ลิตร</span><br>เท่ากับกี่มิลลิลิตร`; say = `${l} ลิตร เท่ากับกี่มิลลิลิตร`; const o = shuffle([l * 1000, l * 100, l * 10]); opts = o.map(x => `${fmt(x)} มล.`); ans = o.indexOf(l * 1000); explain = `1 ล. = 1,000 มล. · ${l} × 1,000 = ${fmt(l * 1000)} มล.`; }
      else if (kind === "conv2"){ const l = rand(1, 5), m = rand(1, 19) * 50, v = l * 1000 + m; html = `<span class="big">${l} ล. ${m} มล.</span><br>เท่ากับกี่มิลลิลิตร`; say = `${l} ลิตร ${m} มิลลิลิตร เท่ากับกี่มิลลิลิตร`; const o = shuffle([...new Set([v, l * 100 + m, l + m])]); opts = o.map(x => `${fmt(x)} มล.`); ans = o.indexOf(v); cols = 1; explain = `${fmt(l * 1000)} + ${m} = ${fmt(v)} มล.`; }
      else if (kind === "unit"){ const T = pick([["น้ำยาล้างจานในขวดเล็ก","มิลลิลิตร"],["น้ำในตู้ปลา","ลิตร"],["ยาน้ำ 1 ช้อน","มิลลิลิตร"],["น้ำมันในถังรถยนต์","ลิตร"],["นมกล่องเล็ก","มิลลิลิตร"]]); html = `${T[0]} ควรบอกปริมาตรเป็นหน่วยใด`; say = html; const u = shuffle(["มิลลิลิตร","ลิตร"]); opts = u; ans = u.indexOf(T[1]); cols = 2; explain = `${T[0]} เหมาะกับหน่วย ${T[1]}`; }
      else if (kind === "sum"){ const a = rand(2, 9) * (level === 1 ? 10 : 50), b = rand(2, 9) * (level === 1 ? 10 : 50); html = `ผสมกาว ${a} มล. กับน้ำ ${b} มล.<br>ได้ส่วนผสมทั้งหมดกี่มิลลิลิตร`; say = html.replace("<br>", " "); near(a + b, level === 1 ? 10 : 50, "มล."); explain = `${a} + ${b} = ${a + b} มล.`; }
      else if (kind === "diff"){ const a = rand(1, 3) * 1000, b = rand(1, 9) * 50 + (level === 3 ? rand(1, 4) * 10 : 0); html = `มีน้ำยา ${fmt(a)} มล. ใช้ทำสไลม์ไป ${b} มล.<br>เหลือน้ำยากี่มิลลิลิตร`; say = html.replace("<br>", " "); near(a - b, 50, "มล."); explain = `${fmt(a)} − ${b} = ${fmt(a - b)} มล.`; }
      else if (kind === "compare"){ const a = rand(1, 2), am = rand(1, 9) * 100, b = rand(1000, 2900); const va = a * 1000 + am;
        html = `ขวด ก มี ${a} ล. ${am} มล. ขวด ข มี ${fmt(b)} มล.<br>ขวดไหนมีน้ำยา<b>มากกว่า</b>`; say = html.replace(/<[^>]+>/g, " "); opts = ["ขวด ก","ขวด ข"]; ans = va > b ? 0 : 1; cols = 2; explain = `ขวด ก = ${fmt(va)} มล. · ขวด ข = ${fmt(b)} มล.`; if (va === b) ans = 0; }
      else { const glue = rand(2, 5) * 100, n = rand(2, 5), tot = glue * n; html = `สไลม์ 1 ก้อนใช้กาว ${glue} มล. ทำ ${n} ก้อน<br>ต้องใช้กาวกี่มิลลิลิตร`; say = html.replace("<br>", " "); const o = shuffle([...new Set([tot, tot + glue, tot - glue])]); opts = o.map(x => `${fmt(x)} มล.${x >= 1000 ? ` (${Math.floor(x / 1000)} ล. ${x % 1000} มล.)` : ""}`); ans = o.indexOf(tot); cols = 1; explain = `${n} × ${glue} = ${fmt(tot)} มล.`; }
      ctx.stage.innerHTML = `${pre}<div id="q"></div>`;
      KIT.mcq(ctx, ctx.stage.querySelector("#q"), {label:`สูตรที่ ${idx+1} จาก ${N}`, html, say, options:opts, answer:ans, cols, explain, onNext:done});
    }
    ctx.progress(0, N); ctx.say("ใส่ถุงมือ เริ่มทดลอง!");
    next();
  }
});

})();
</script>
</body>
</html>
