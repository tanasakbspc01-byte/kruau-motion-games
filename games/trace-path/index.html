<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลากตามทางไม่ให้หลุด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
.cv{display:block;width:100%;max-width:820px;margin:14px auto 0;aspect-ratio:8/5;border-radius:24px;background:#BFE3C0;box-shadow:0 6px 0 #92C796;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<script src="kit.js"></script>
<script>
(function(){
const {rand} = KIT;
const W = 800, H = 500, ROUNDS = 4;
const LV = {1:{hw:34, f:[1,1.5], amp:120}, 2:{hw:24, f:[1.5,2.2], amp:150}, 3:{hw:17, f:[2,2.6], amp:160}};
function makePath(L){
  const f = L.f[0] + Math.random()*(L.f[1]-L.f[0]), ph = Math.random()*Math.PI*2, f2 = 2 + Math.random()*2, ph2 = Math.random()*6;
  const pts = [];
  for (let i=0; i<=600; i++){
    const t = i/600;
    const x = 70 + t*(W-140);
    let y = H/2 + L.amp*Math.sin(Math.PI*2*f*t + ph) + 30*Math.sin(Math.PI*2*f2*t + ph2);
    y = Math.max(55, Math.min(H-55, y));
    pts.push([x,y]);
  }
  return pts;
}
function nearest(pts, x, y, from, to){
  let bi = -1, bd = 1e9;
  for (let i=Math.max(0,from); i<=Math.min(pts.length-1,to); i++){ const d = Math.hypot(pts[i][0]-x, pts[i][1]-y); if (d < bd){ bd = d; bi = i; } }
  return [bi, bd];
}

KIT.mount({
  key:"x6-path", title:"ลากตามทางไม่ให้หลุด", subtitle:"เกมฝึกสมาธิและการใช้เมาส์ · ป.1–6",
  heroHTML:"กดค้างแล้วลาก<em>ตามทาง</em>ให้ถึงธง 🏁", heroDesc:"พาลูกบอลเดินตามทางคดเคี้ยว ห้ามออกนอกทาง ฝึกมือให้นิ่งและใจให้จดจ่อ",
  progIcon:"🏁",
  howto:["กดค้างที่ลูกบอลสีเหลืองตรงจุดเริ่ม (ใช้เมาส์หรือนิ้ว)","ลากไปตามทางสีขาวจนถึงธง 🏁 โดยไม่ปล่อยมือ","ถ้าออกนอกทางหรือปล่อยมือ ต้องเริ่มใหม่จากจุดเริ่ม และเสีย 10 คะแนน","ผ่านครบ 4 เส้นทางผ่านด่าน"],
  levels:{
    1:{pill:"ทางกว้าง", color:"var(--green)", desc:"ทางกว้าง โค้งน้อย"},
    2:{pill:"ทางกลาง", color:"var(--blue)", desc:"ทางแคบลง โค้งมากขึ้น"},
    3:{pill:"ทางแคบ", color:"var(--purple)", desc:"ทางแคบ คดเคี้ยวมาก ต้องนิ่งสุด ๆ"}
  },
  play(level, ctx){
    const L = LV[level];
    ctx.stage.innerHTML = `<div class="qcard"><div class="qlabel" id="qn"></div><div class="qtext" id="st">กดค้างที่ลูกบอลสีเหลือง</div></div>
      <canvas class="cv" id="cv" width="${W*2}" height="${H*2}" aria-label="ทางให้ลากตาม"></canvas>`;
    const $ = s => ctx.stage.querySelector(s);
    const cv = $("#cv"), g = cv.getContext("2d"); g.scale(2,2);
    let round = 0, pts, prog = 0, drag = false, ball = null, lock = false, fails = 0;
    function draw(){
      g.clearRect(0,0,W,H);
      g.lineCap = "round"; g.lineJoin = "round";
      const line = (n, w, c) => { g.beginPath(); g.moveTo(...pts[0]); for (let i=1;i<=n;i++) g.lineTo(...pts[i]); g.lineWidth = w; g.strokeStyle = c; g.stroke(); };
      line(pts.length-1, L.hw*2+8, "#8A6141");
      line(pts.length-1, L.hw*2, "#FFFDF7");
      if (prog > 0) line(prog, L.hw*1.1, "rgba(127,211,154,.9)");
      const [ex,ey] = pts[pts.length-1];
      g.font = "52px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("🏁", ex+8, ey-22);
      const [bx,by] = ball || pts[prog];
      g.beginPath(); g.arc(bx, by, Math.max(13, L.hw*.7), 0, Math.PI*2); g.fillStyle = "#F6CD6B"; g.fill(); g.lineWidth = 4; g.strokeStyle = "#E08A3C"; g.stroke();
      if (!drag && prog === 0){ g.font = "bold 22px Mali, sans-serif"; g.fillStyle = "#5A4335"; g.fillText("เริ่ม", pts[0][0], pts[0][1] - L.hw - 22); }
    }
    function newRound(){
      if (round >= ROUNDS){ ctx.finish({targetSec: [0,50,70,100][level]}); return; }
      pts = makePath(L); prog = 0; ball = null; drag = false; lock = false; fails = 0;
      $("#qn").textContent = `เส้นทางที่ ${round+1} จาก ${ROUNDS}`; $("#st").textContent = "กดค้างที่ลูกบอลสีเหลือง แล้วลากไปที่ธง";
      draw();
    }
    const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W, (e.clientY-r.top)/r.height*H]; };
    function fail(msg){
      drag = false; prog = 0; ball = null; fails++;
      ctx.wrong(msg, 10); $("#st").textContent = "เริ่มใหม่จากลูกบอลสีเหลืองนะ";
      draw();
    }
    cv.addEventListener("pointerdown", e => {
      if (lock) return;
      const [x,y] = pos(e);
      if (Math.hypot(x-pts[0][0], y-pts[0][1]) < Math.max(L.hw, 26) + 10){
        drag = true; prog = 0; ball = [x,y]; try { cv.setPointerCapture(e.pointerId); } catch(_){}
        $("#st").textContent = "ค่อย ๆ ลากไปตามทาง…"; KIT.sfx.tap(); draw();
      } else if (prog === 0) ctx.say("เริ่มที่ลูกบอลสีเหลืองทางซ้ายก่อนนะ");
      e.preventDefault();
    });
    cv.addEventListener("pointermove", e => {
      if (!drag || lock) return;
      const [x,y] = pos(e);
      const [i, d] = nearest(pts, x, y, prog-30, prog+75);
      if (d > L.hw + 2){ fail("ออกนอกทางแล้ว! ลองใหม่อีกครั้ง"); return; }
      if (i > prog) prog = i;
      ball = [x,y]; draw();
      if (prog >= pts.length-6){
        lock = true; drag = false; round++;
        ctx.correct(fails === 0 ? 150 : 80, fails === 0 ? "ถึงธงรวดเดียว! สุดยอด" : "ถึงธงแล้ว!"); ctx.progress(round, ROUNDS);
        $("#st").textContent = "🎉 ถึงธงแล้ว"; ctx.after(900, newRound);
      }
    });
    const up = () => { if (drag && !lock) fail("ปล่อยมือก่อนถึงธง ลองใหม่นะ"); };
    cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
    ctx.progress(0, ROUNDS); ctx.say("กดค้างที่ลูกบอลแล้วลากไปให้ถึงธง");
    newRound();
  }
});
})();
</script>
</body>
</html>
