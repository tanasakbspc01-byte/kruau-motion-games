<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ช่างกระเบื้อง 100 ช่อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
.wall{display:grid;grid-template-columns:34px repeat(10,1fr);gap:4px;width:100%;max-width:480px;margin:0 auto;padding:10px;background:#E9DCCB;border-radius:18px;box-shadow:0 5px 0 #D6C3AA}
.cell{aspect-ratio:1;border:none;border-radius:5px;background:#FFFDF8;box-shadow:inset 0 -2px 0 #EADBC6;padding:0;transition:background .12s}
.cell.on{background:var(--t);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.rowtag{border:none;background:#fff;border-radius:6px;font-size:.72rem;font-weight:700;color:var(--ink-soft);padding:0}
.wall.ro{pointer-events:none}
.wall.ro .rowtag{opacity:.75}
.wall.shine{animation:shine .9s}
.wall.reveal .cell.on{outline:2px solid #2C8A52;outline-offset:-2px}
.meter{text-align:center;font-weight:700;font-size:1.1rem}
.sw{display:inline-block;width:22px;height:22px;border-radius:6px;vertical-align:-3px;border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.bignum{display:inline-block;font-size:2rem;font-weight:700;color:var(--orange-deep);margin:0 .2em;vertical-align:middle}
@keyframes shine{50%{box-shadow:0 0 0 8px rgba(127,211,154,.6),0 5px 0 #D6C3AA}}
@media (max-width:520px){.wall{grid-template-columns:26px repeat(10,1fr);gap:3px;padding:7px}.rowtag{font-size:.6rem}}

</style>
</head>
<body>
<script src="kit.js"></script>
<script>
(function(){
const {rand, pick, shuffle, gcd, frac, thaiWords} = KIT;
const N = 8;
const TILE = ["#F2A65A","#86B6F0","#7FD39A","#E8708F","#B7A4EE","#F6CD6B","#5FC4B8","#F28C6B"];
const word = n => thaiWords ? thaiWords(n) : String(n);
/* plan per level: P = paint, R = read grid, W = how to read/write, F = fraction <-> percent, U = unpainted part */
const PLAN = {1:["P","R","P","W","R","P","W","R"], 2:["P","U","W","F","P","R","U","F"], 3:["P","F","P","U","F","P","W","F"]};

KIT.mount({
  key:"m5-tiles", title:"ช่างกระเบื้อง 100 ช่อง", subtitle:"คณิตศาสตร์ ป.5 · บทที่ 5 ร้อยละ · การอ่านและการเขียนร้อยละ",
  heroHTML:"ปูกระเบื้องให้ได้<em>ร้อยละ</em>ตามสั่ง 🧱", heroDesc:"ผนังมี 100 ช่อง ระบาย 1 ช่อง = 1 ใน 100 = ร้อยละ 1 = 1% รับออเดอร์จากลูกค้า แล้วปูกระเบื้องให้พอดี",
  progIcon:"🧱",
  howto:["ข้อที่ให้ปูกระเบื้อง: แตะช่องที่ต้องการ ระบบจะเติมสีตั้งแต่ช่องแรกจนถึงช่องที่แตะ แตะหัวแถวเพื่อเติมทีละ 10 ช่อง","กด \"ส่งงาน\" เมื่อปูครบ","ข้อที่ให้อ่าน: นับช่องที่ระบายแล้วแตะคำตอบ","ร้อยละ 25 เขียนว่า 25% อ่านว่า ร้อยละยี่สิบห้า หรือ ยี่สิบห้าเปอร์เซ็นต์"],
  note:"ร้อยละ หรือ เปอร์เซ็นต์ คือ อัตราส่วนที่เทียบกับ 100 เช่น 35 ใน 100 = 35/100 = ร้อยละ 35 = 35%",
  levels:{
    1:{pill:N+" ออเดอร์", color:"var(--green)", desc:"ระบายตามร้อยละ อ่านร้อยละจากตาราง และคำอ่าน"},
    2:{pill:N+" ออเดอร์", color:"var(--blue)", desc:"ส่วนที่ไม่ได้ระบาย และเศษส่วนที่ตัวส่วนเป็น 100"},
    3:{pill:N+" ออเดอร์", color:"var(--purple)", desc:"เศษส่วนตัวส่วน 2, 4, 5, 10, 20, 25, 50 ↔ ร้อยละ"}
  },
  play(level, ctx){
    let idx = 0;
    const grid = (id, painted, col) => `<div class="wall" id="${id}">${[...Array(10).keys()].map(r => `<button class="rowtag" type="button" data-row="${r}" aria-label="เติมถึงแถวที่ ${r+1}">${(r+1)*10}</button>` +
      [...Array(10).keys()].map(c => { const i = r*10 + c; return `<button class="cell${i < painted ? " on" : ""}" type="button" data-i="${i}" aria-label="ช่องที่ ${i+1}" style="--t:${col}"></button>`; }).join("")).join("")}</div>`;
    const done = () => { idx++; ctx.progress(idx, N); next(); };
    const lbl = () => `ออเดอร์ที่ ${idx+1} จาก ${N}`;
    function next(){
      if (idx >= N){ ctx.finish({targetSec: level === 3 ? 200 : 160}); return; }
      const kind = PLAN[level][idx], col = TILE[idx % TILE.length];
      if (kind === "P") return paint(col);
      if (kind === "R" || kind === "U") return read(kind, col);
      if (kind === "W") return words();
      return fracQ();
    }
    function paintTarget(){
      if (level === 3 && Math.random() < .7){
        const d = pick([2,4,5,10,20,25,50]); let n; do { n = rand(1, d-1); } while (gcd(n,d) !== 1 && d !== 10);
        return {pct: n*100/d, show:`${frac(n,d)} ของผนัง`, say:`${n}/${d} ของผนัง`};
      }
      const p = level === 1 ? pick([rand(1,9)*10, rand(11,99)]) : rand(3,97);
      const style = level === 1 ? pick(["num","word"]) : pick(["num","word","pct"]);
      const show = style === "num" ? `ร้อยละ ${p}` : style === "pct" ? `${p}%` : `ร้อยละ${word(p)}`;
      return {pct:p, show, say:show};
    }
    function paint(col){
      const T = paintTarget();
      let cnt = 0, miss = 0, lock = false;
      ctx.stage.innerHTML = `<div class="qcard"><div class="qlabel">${lbl()} · ปูกระเบื้อง</div><div class="qtext">ลูกค้าสั่ง: ปูกระเบื้องสี <span class="sw" style="background:${col}"></span> <b>${T.show}</b></div></div>
        ${grid("w", 0, col)}<div class="meter" id="m">ปูแล้ว 0 ช่อง</div>
        <div class="row"><button class="btn ghost" type="button" id="clr">ล้าง</button><button class="btn" type="button" id="send">ส่งงาน</button></div>`;
      const $ = s => ctx.stage.querySelector(s), wall = $("#w");
      const draw = () => { wall.querySelectorAll(".cell").forEach((c,i) => c.classList.toggle("on", i < cnt)); $("#m").textContent = `ปูแล้ว ${cnt} ช่อง`; };
      wall.onclick = e => {
        if (lock) return;
        const c = e.target.closest(".cell"), r = e.target.closest(".rowtag");
        if (c){ const i = +c.dataset.i; cnt = cnt === i+1 ? i : i+1; }
        else if (r){ const v = (+r.dataset.row + 1)*10; cnt = cnt === v ? v - 10 : v; }
        else return;
        KIT.sfx.tap(); draw();
      };
      $("#clr").onclick = () => { if (!lock){ cnt = 0; draw(); } };
      $("#send").onclick = () => {
        if (lock) return;
        const qq = `ปูกระเบื้อง ${T.say}`, aa = `${T.pct} ช่อง = ร้อยละ ${T.pct} = ${T.pct}%`;
        if (cnt === T.pct){ lock = true; ctx.record({q:qq, a:aa, score: miss ? .5 : 1}); wall.classList.add("shine"); ctx.correct(miss ? 50 : 100, `ปูพอดี ${T.pct} ช่อง = ${T.pct}%`); ctx.after(1100, done); return; }
        miss++;
        const how = cnt < T.pct ? `ยังขาดอีก ${T.pct - cnt} ช่อง` : `เกินมา ${cnt - T.pct} ช่อง`;
        if (miss < 2){ ctx.wrong(`ตอนนี้ปู ${cnt} ช่อง ${level === 3 && T.say.includes("/") ? "ลองทำตัวส่วนให้เป็น 100 ก่อน" : how} (เหลืออีก 1 ครั้ง)`); return; }
        lock = true; cnt = T.pct; draw(); wall.classList.add("reveal");
        ctx.wrong(null); ctx.record({q:qq, a:aa, score:0});
        ctx.reveal(`📖 เฉลย: ${T.say} = ${T.pct} ช่องจาก 100 ช่อง = ${T.pct}%`); ctx.after(3600, done);
      };
    }
    function read(kind, col){
      const p = level === 1 ? rand(5,95) : rand(2,98);
      const ans = kind === "U" ? 100 - p : p;
      const opts = new Set([ans]);
      for (const v of shuffle([100 - ans, ans + 10, ans - 10, ans + 1, ans - 1, Math.floor(ans/10) + (ans%10)*10])) if (opts.size < 4 && v > 0 && v < 100) opts.add(v);
      const style = Math.random() < .5;
      const list = shuffle([...opts]);
      ctx.stage.innerHTML = `${grid("w", p, col)}<div id="q"></div>`;
      ctx.stage.querySelector("#w").classList.add("ro");
      KIT.mcq(ctx, ctx.stage.querySelector("#q"), {label:lbl(), html: kind === "U" ? "ส่วนที่<b>ยังไม่ได้ปู</b>คิดเป็นร้อยละเท่าไร" : "กระเบื้องสีที่ปูแล้วคิดเป็นร้อยละเท่าไร",
        options:list.map(v => style ? `ร้อยละ ${v}` : `${v}%`), answer:list.indexOf(ans), explain: kind === "U" ? `ปูแล้ว ${p} ช่อง เหลือ 100 − ${p} = ${ans} ช่อง` : `นับแถวละ 10 ได้ ${p} ช่อง จาก 100 ช่อง`, onNext:done});
    }
    function words(){
      const p = rand(11, 99), mode = rand(0,2);
      let html, opts, answer, explain = `${p}% อ่านว่า ร้อยละ${word(p)} หรือ ${word(p)}เปอร์เซ็นต์`;
      if (mode === 0){
        html = `<span class="bignum">${p}%</span> อ่านว่าอย่างไร`;
        opts = [`ร้อยละ${word(p)}`, `${word(p)}ร้อยละ`, `เปอร์เซ็นต์${word(p)}`, `ร้อยละ${word(Number(String(p).split("").reverse().join("")) || p+1)}`];
      } else if (mode === 1){
        html = `<span class="bignum">ร้อยละ ${p}</span> อ่านได้อีกแบบว่าอย่างไร`;
        opts = [`${word(p)}เปอร์เซ็นต์`, `เปอร์เซ็นต์${word(p)}`, `${word(p)}ร้อย`, `หนึ่งร้อย${word(p)}`];
      } else {
        html = `"<b>ร้อยละ${word(p)}</b>" เขียนเป็นตัวเลขได้อย่างไร`;
        opts = [`${p}%`, `${p}/10`, `%${p}`, `${p}.100`];
        explain = `ร้อยละ${word(p)} เขียนว่า ร้อยละ ${p} หรือ ${p}%`;
      }
      const uniq = [...new Set(opts)], order = shuffle(uniq.slice());
      KIT.mcq(ctx, ctx.stage, {label:lbl() + " · อ่านเขียนร้อยละ", html, options:order, answer:order.indexOf(uniq[0]), cols:1, explain, onNext:done});
    }
    function fracQ(){
      let n, d;
      if (level === 2){ d = 100; n = rand(1,99); }
      else { d = pick([2,4,5,10,20,25,50]); do { n = rand(1,d-1); } while (gcd(n,d) !== 1 && d !== 10); }
      const p = n*100/d, toPct = level === 2 || Math.random() < .6;
      if (toPct){
        const opts = new Set([p]); for (const v of shuffle([n, d, n*10, p+5, p-5, 100-p, n+d])) if (opts.size < 4 && v > 0 && v < 100 && Number.isInteger(v)) opts.add(v);
        while (opts.size < 4) opts.add(rand(1,99));
        const list = shuffle([...opts]);
        KIT.mcq(ctx, ctx.stage, {label:lbl() + " · เศษส่วน → ร้อยละ", html:`<span class="bignum">${frac(n,d)}</span> เขียนเป็นร้อยละได้เท่าไร`, options:list.map(v => `${v}%`), answer:list.indexOf(p),
          explain: d === 100 ? `${n}/100 = ร้อยละ ${n}` : `คูณ ${100/d} ทั้งเศษและส่วน ได้ ${p}/100 = ${p}%`, onNext:done});
      } else {
        const g = gcd(p,100), right = `${p/g}/${100/g}`;
        const cand = [right, `${p}/10`, `${p/g+1}/${100/g}`, `${100/g}/${p/g}`, `1/${p}`];
        const uniq = [...new Set(cand)].slice(0,4), list = shuffle(uniq.slice());
        KIT.mcq(ctx, ctx.stage, {label:lbl() + " · ร้อยละ → เศษส่วน", html:`<span class="bignum">${p}%</span> เขียนเป็นเศษส่วนอย่างต่ำได้เท่าไร`, options:list, answer:list.indexOf(right),
          explain:`${p}% = ${p}/100 = ${right}`, onNext:done});
      }
    }
    ctx.progress(0, N); ctx.say("ออเดอร์แรกมาแล้ว!");
    next();
  }
});

})();
</script>
</body>
</html>
